# Mutation testing targets (task mutation/check). Efficacy is killed over
# killed and lived, timed-out mutants counting as killed. A surviving mutant
# is either a missing test or listed here as equivalent, with the reason no
# test can tell it apart.

[[target]]
package = "pkg/merge"
min_efficacy = 95
  [[target.equivalent]]
  at = "merge.go:143:22"
  type = "CONDITIONALS_BOUNDARY"
  reason = "candidates are deduplicated before sorting, so no two compare equal and < and <= order them alike"

