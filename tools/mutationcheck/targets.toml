min_efficacy = 95
  [[target.equivalent]]
  at = "signing.go:130:12"
  type = "CONDITIONALS_BOUNDARY"
  reason = "a device ID is 64 hex characters, so Fingerprint never sees exactly 20"
  [[target.equivalent]]
  at = "signing.go:151:34"
