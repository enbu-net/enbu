  reason = "only the capacity of the message buffer changes, not its contents"
  [[target.equivalent]]
  at = "signing.go:177:25"
  type = "CONDITIONALS_BOUNDARY"
  reason = "a valid signature with s exactly half the group order cannot be produced (probability 2^-255)"

