version: '3'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list-all --sort alphanumeric

  all/test:
    desc: Run all tests
    deps:
      - cli/test
      - gui/test
      - vscode/test
      - scripts/test

  cli/test:
    desc: Run all CLI tests
    deps:
      - cli/test/unit
      - cli/test/scenario
      - cli/test/e2e
      - identity/test/e2e
      - storage/test/e2e
      - export/aws/test/e2e

  cli/test/unit:
    desc: Run unit tests
    deps:
      - gui/build/frontend
    cmds:
      - go test -v -shuffle=on -race -tags=fixture ./...

  cli/test/scenario:
    desc: Run scenario tests
    deps:
      - gui/build/frontend
    cmds:
      - docker compose up -d --wait
      - defer: docker compose down
      - curl --fail --silent --show-error --retry 50 --retry-delay 0 --retry-connrefused --retry-max-time 30 http://localhost:5000/v2/
      - go test -v -shuffle=on -race -tags=fixture,scenario ./...

  cli/test/coverage:
    desc: Collect all Go unit tests with tobari, including desktop
    deps:
      - gui/build/frontend
    cmds:
      - uv run --project scripts python scripts/tobari.py unit

  cli/test/coverage/scenario:
    desc: Collect Go scenario coverage with tobari
    deps:
      - gui/build/frontend
    cmds:
      - docker compose up -d --wait
      - defer: docker compose down
      - curl --fail --silent --show-error --retry 50 --retry-delay 0 --retry-connrefused --retry-max-time 30 http://localhost:5000/v2/
      - uv run --project scripts python scripts/tobari.py scenario

  cli/test/coverage/e2e:
    desc: Collect subprocess CLI E2E coverage with tobari
    cmds:
      - uv run --project scripts python scripts/tobari.py e2e

  identity/test/coverage:
    desc: Collect Identity E2E and child CLI coverage with tobari
    cmds:
      - uv run --project scripts python scripts/tobari.py identity

  coverage/report:
    desc: Merge all Go coverage suites and generate interactive HTML
    cmds:
      - uv run --project scripts python scripts/tobari.py report

  all/coverage:
    desc: Collect Go unit, scenario, CLI E2E, Identity, and React coverage
    cmds:
      - task cli/test/coverage
      - task cli/test/coverage/scenario
      - task cli/test/coverage/e2e
      - task identity/test/coverage
      - task coverage/report
      - task gui/test/coverage

  gui/test/coverage:
    desc: Collect React test coverage with V8
    deps:
      - gui/build/frontend
    dir: web
    cmds:
      - vp test --coverage

  core/test:
    desc: Run platform-neutral core tests without frontend generation
    deps:
      - core/test/unit

  core/test/unit:
    desc: Run platform-neutral core unit tests
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test -v -shuffle=on ./pkg/artifact/... ./pkg/content/... ./pkg/schema/secretmap/... ./pkg/schema/opaque/... ./pkg/export/awssecrets/...

  cli/test/e2e:
    desc: Run CLI end-to-end tests with atago
    cmds:
      - docker compose -p enbu-e2e -f test/e2e/compose.yaml down --volumes --remove-orphans
      - docker compose -p enbu-e2e -f test/e2e/compose.yaml up -d --wait
      - defer: docker compose -p enbu-e2e -f test/e2e/compose.yaml down --volumes --remove-orphans
      - curl --fail --silent --show-error --retry 50 --retry-delay 0 --retry-connrefused --retry-max-time 30 http://localhost:5001/v2/
      - aqua exec -- atago list test/e2e
      - aqua exec -- atago run --ci --report gha --artifacts-dir .tmp/atago-artifacts test/e2e

  identity/test/e2e:
    desc: Run Identity CLI E2E with local OCI and persistent vTPM (real OS keyring required)
    cmds:
      - go test -v -count=1 -tags=fixture,identitye2e ./test/identitye2e

  storage/test/e2e:
    desc: Run OCI and S3 contracts plus shared CLI E2E against RustFS
    env:
      ENBU_TEST_OCI_REF: localhost:5002/storage-tests
      ENBU_TEST_S3_ENDPOINT: http://localhost:9002
      ENBU_TEST_S3_BUCKET: enbu-storage-tests
      ENBU_TEST_CREATE_BUCKET: '1'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: enbu-test-access
      AWS_SECRET_ACCESS_KEY: enbu-test-secret
    cmds:
      - docker compose -p enbu-storage -f test/storage/compose.yaml down --volumes --remove-orphans
      - docker compose -p enbu-storage -f test/storage/compose.yaml up -d --wait
      - defer: docker compose -p enbu-storage -f test/storage/compose.yaml down --volumes --remove-orphans
      - curl --fail --silent --show-error --retry 50 --retry-delay 1 --retry-connrefused --retry-max-time 50 http://localhost:5002/v2/
      - curl --fail --silent --show-error --retry 50 --retry-delay 1 --retry-connrefused --retry-max-time 50 http://localhost:9002/health
      - go test -v -race -count=1 -tags=storagee2e ./pkg/storage -run TestRemoteStorage
      - go test -v -count=1 -tags=fixture,identitye2e ./test/identitye2e -run TestStorageBackendLifecycles

  export/aws/test/e2e:
    desc: Verify AWS Secrets Manager plans through AWS SDK v2 and Kumo
    env:
      ENBU_TEST_KUMO_ENDPOINT: http://localhost:4566
    cmds:
      - docker compose -p enbu-aws -f test/aws/compose.yaml down --volumes --remove-orphans
      - docker compose -p enbu-aws -f test/aws/compose.yaml up -d --wait
      - defer: docker compose -p enbu-aws -f test/aws/compose.yaml down --volumes --remove-orphans
      - >-
        curl --fail --silent --show-error --retry 50 --retry-delay 1
        --retry-connrefused --retry-max-time 50
        -H 'Content-Type: application/x-amz-json-1.1'
        -H 'X-Amz-Target: secretsmanager.ListSecrets'
        -d '{}' http://localhost:4566
      - go test -v -race -count=1 -tags=awse2e ./test/aws

  gui/test:
    desc: Run GUI tests
    deps:
      - gui/build/frontend
    dir: web
    cmds:
      - vp test

  scripts/test:
    desc: Run release automation tests
    dir: scripts
    cmds:
      - uv run pytest

  all/build:
    desc: Build CLI, GUI and the VS Code extension
    deps:
      - cli/build
      - gui/build
      - vscode/build

  cli/build:
    desc: Build CLI
    deps:
      - gui/build/frontend
    cmds:
      - go build -o enbu .

  gui/build:
    desc: Build GUI desktop app into desktop/wails/build/bin
    deps:
      - gui/build/frontend
      - tools/wails3
    dir: desktop/wails
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "(unset)"
      # macOS bundle versions must be numeric.
      BUNDLE_VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null | sed -E 's/^v//; s/[^0-9.].*$//' | grep . || echo 0.0.0
      LDFLAGS: -s -w -X main.Version={{.VERSION}}
      WAILS3: ../../.tmp/bin/wails3{{exeExt}}
    cmds:
      - mkdir -p build/bin
      - '{{.WAILS3}} generate icons -input ../../assets/icon.png -windowsfilename build/icon.ico -macfilename build/icons.icns'
      - cmd: '{{.WAILS3}} generate syso -arch {{ARCH}} -icon build/icon.ico -manifest packaging/windows/enbu-desktop.exe.manifest -out rsrc_windows_{{ARCH}}.syso'
        platforms: [windows]
      - cmd: go build -tags production -trimpath -ldflags "{{.LDFLAGS}} -H windowsgui" -o build/bin/enbu-desktop.exe .
        platforms: [windows]
      - cmd: go build -tags production -trimpath -ldflags "{{.LDFLAGS}}" -o build/bin/enbu-desktop .
        platforms: [linux, darwin]
      - cmd: |
          app=build/bin/enbu-desktop.app
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          mv build/bin/enbu-desktop "$app/Contents/MacOS/enbu-desktop"
          cp build/icons.icns "$app/Contents/Resources/icons.icns"
          cp packaging/darwin/Info.plist "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "{{.BUNDLE_VERSION}}" "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "{{.BUNDLE_VERSION}}" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
        platforms: [darwin]

  gui/run:
    desc: Run GUI desktop app against the Vite dev server (frontend hot reload; Ctrl-C stops both)
    deps:
      - gui/run/frontend
      - gui/run/app

  gui/run/frontend:
    internal: true
    deps:
      - gui/build/frontend
    dir: web
    cmds:
      - vp dev --port 5173 --strictPort

  gui/run/app:
    internal: true
    deps:
      - gui/build/frontend
    dir: desktop/wails
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "(unset)"
    env:
      FRONTEND_DEVSERVER_URL: http://localhost:5173
    cmds:
      - curl --fail --silent --output /dev/null --retry 60 --retry-delay 1 --retry-connrefused http://localhost:5173/
      - go run -ldflags "-X main.Version={{.VERSION}}" .

  gui/bindings:
    desc: Regenerate the frontend's TypeScript bindings of the desktop service (web/src/bindings)
    deps:
      - gui/build/frontend
      - tools/wails3
    dir: desktop/wails
    cmds:
      - ../../.tmp/bin/wails3{{exeExt}} generate bindings -silent -ts -d ../../web/src/bindings .

  tools/wails3:
    internal: true
    run: once
    sources:
      - tools/wails3/go.mod
      - tools/wails3/go.sum
    generates:
      - .tmp/bin/wails3{{exeExt}}
    cmds:
      - go build -C tools/wails3 -o ../../.tmp/bin/wails3{{exeExt}} github.com/wailsapp/wails/v3/cmd/wails3

  all/check:
    desc: Format and lint all code
    deps:
      - cli/check
      - gui/check
      - vscode/check
      - scripts/check

  cli/check:
    desc: Format and lint CLI code
    deps:
      - gui/build/frontend
    cmds:
      - go run ./tools/apperrlint .
      - golangci-lint run --fix --build-tags fixture ./...
      - golangci-lint fmt ./...
      - git diff --exit-code -- '*.go'

  cli/vuln:
    desc: Scan Go dependencies and the standard library for known vulnerabilities
    cmds:
      - govulncheck -tags fixture ./...

  gui/check:
    desc: Format and lint GUI code, and check the generated bindings are current
    deps:
      - gui/build/frontend
    cmds:
      - task: gui/bindings
      - git diff --exit-code -- web/src/bindings
      - test -z "$(git status --porcelain -- web/src/bindings)"
      - cd web && vp check

  vscode/test:
    desc: Run VS Code extension tests
    deps:
      - vscode/install
    dir: vscode
    cmds:
      - vp test

  vscode/check:
    desc: Format and lint VS Code extension code
    deps:
      - vscode/install
    dir: vscode
    cmds:
      - vp check

  vscode/build:
    desc: Build the VS Code extension into vscode/dist and vscode/media
    deps:
      - vscode/install
      - vscode/build/frontend
    dir: vscode
    cmds:
      - vp run build

  vscode/install:
    internal: true
    run: once
    dir: vscode
    cmds:
      - vp env off
      - vp install --frozen-lockfile

  vscode/build/frontend:
    internal: true
    run: once
    dir: web
    cmds:
      - task: gui/install
      - vp run build:vscode

  scripts/check:
    desc: Check Python formatting and lint
    dir: scripts
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .

  scripts/fmt:
    desc: Format Python release automation
    dir: scripts
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  scripts/lint:
    desc: Lint Python release automation
    dir: scripts
    cmds:
      - uv run ruff check .

  gui/preview:
    desc: Build GUI frontend in mock/preview mode
    deps:
      - gui/install
    dir: web
    cmds:
      - vp run build:preview

  gui/install:
    internal: true
    run: once
    dir: web
    cmds:
      - vp env off
      - vp install --frozen-lockfile

  gui/build/frontend:
    internal: true
    run: once
    dir: web
    cmds:
      - task: gui/install
      - vp run build
    # The release workflow builds the frontend once and downloads web/dist into
    # every desktop build job; ENBU_FRONTEND_PREBUILT=1 skips the rebuild there.
    status:
      - test "${ENBU_FRONTEND_PREBUILT:-}" = "1"
      - test -f dist/index.html
