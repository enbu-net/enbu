version: '3'

vars:
  # The commit time stands in for the build time in release archives
  # (https://reproducible-builds.org/specs/source-date-epoch/).
  SOURCE_DATE_EPOCH:
    sh: git log -1 --format=%ct 2>/dev/null || echo 0

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list-all --sort alphanumeric

  all/test:
    desc: Run all tests
    deps:
      - cli/test
      - gui/test
      - vscode/test
      - scripts/test
      - simulation/smoke

  simulation/smoke:
    desc: Run bounded deterministic simulation regressions
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test -count=1 -timeout=2m ./test/simulation -run '^TestSimulationSmoke$'

  simulation/test:
    desc: Run deterministic simulations and strict replays
    env:
      ENBU_SIM_EXPLORE: '1'
      ENBU_SIM_ARTIFACTS: '{{.ROOT_DIR}}/.tmp/simulation'
      CGO_ENABLED: '0'
    cmds:
      - go test -count=1 -timeout=55m ./pkg/merge ./test/simulation

  cli/test:
    desc: Run all CLI tests
    deps:
      - cli/test/unit
      - cli/test/scenario
      - cli/test/e2e
      - identity/test/e2e
      - storage/test/e2e
      - export/aws/test/e2e

  cli/test/unit:
    desc: Run unit tests
    deps:
      - gui/build/frontend
    cmds:
      - go test -v -shuffle=on -race -timeout=55m -tags=fixture ./...

  cli/test/scenario:
    desc: Run scenario tests
    deps:
      - gui/build/frontend
    cmds:
      - docker compose up -d --wait
      - defer: docker compose down
      - curl --fail --silent --show-error --retry-all-errors --retry 50 --retry-delay 0 --retry-connrefused --retry-max-time 30 http://localhost:5000/v2/
      - go test -v -shuffle=on -race -timeout=55m -tags=fixture,scenario ./cli ./test

  cli/test/coverage:
    desc: Collect all Go unit tests with tobari, including desktop
    deps:
      - gui/build/frontend
    cmds:
      - uv run --project scripts python scripts/tobari.py unit

  cli/test/coverage/scenario:
    desc: Collect Go scenario coverage with tobari
    deps:
      - gui/build/frontend
    cmds:
      - docker compose up -d --wait
      - defer: docker compose down
      - curl --fail --silent --show-error --retry-all-errors --retry 50 --retry-delay 0 --retry-connrefused --retry-max-time 30 http://localhost:5000/v2/
      - uv run --project scripts python scripts/tobari.py scenario

  cli/test/coverage/e2e:
    desc: Collect subprocess CLI E2E coverage with tobari
    cmds:
      - uv run --project scripts python scripts/tobari.py e2e

  identity/test/coverage:
    desc: Collect Identity E2E and child CLI coverage with tobari
    cmds:
      - uv run --project scripts python scripts/tobari.py identity

  coverage/report:
    desc: Merge all Go coverage suites and generate interactive HTML
    cmds:
      - uv run --project scripts python scripts/tobari.py report

  all/coverage:
    desc: Collect Go unit, scenario, CLI E2E, Identity, and React coverage
    cmds:
      - task cli/test/coverage
      - task cli/test/coverage/scenario
      - task cli/test/coverage/e2e
      - task identity/test/coverage
      - task coverage/report
      - task gui/test/coverage

  gui/test/coverage:
    desc: Collect React test coverage with V8
    deps:
      - gui/install
      - gui/build/frontend
    dir: web
    cmds:
      - vp test --coverage

  core/test:
    desc: Run platform-neutral core tests without frontend generation
    deps:
      - core/test/unit

  core/test/unit:
    desc: Run platform-neutral core unit tests
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test -v -shuffle=on ./pkg/artifact/... ./pkg/content/... ./pkg/config/... ./pkg/schema/secretmap/... ./pkg/schema/opaque/... ./pkg/export/awssecrets/... ./pkg/storage/... ./pkg/wsp/...

  cli/test/e2e:
    desc: Run CLI end-to-end tests with atago
    cmds:
      - docker compose -p enbu-e2e -f test/e2e/compose.yaml down --volumes --remove-orphans
      - docker compose -p enbu-e2e -f test/e2e/compose.yaml up -d --wait
      - defer: docker compose -p enbu-e2e -f test/e2e/compose.yaml down --volumes --remove-orphans
      - curl --fail --silent --show-error --retry-all-errors --retry 50 --retry-delay 0 --retry-connrefused --retry-max-time 30 http://localhost:5001/v2/
      - aqua exec -- atago list test/e2e
      - aqua exec -- atago run --ci --report gha --artifacts-dir .tmp/atago-artifacts --skip-tag auth test/e2e
      # The auth scenarios share the one OS keyring that holds the token, so they run one at a time.
      - aqua exec -- atago run --ci --report gha --artifacts-dir .tmp/atago-artifacts --tag auth --parallel 1 test/e2e

  identity/test/e2e:
    desc: Run Identity CLI E2E with local OCI and persistent vTPM (real OS keyring required)
    cmds:
      - go test -v -count=1 -tags=fixture,identitye2e ./test/identitye2e

  storage/test/e2e:
    desc: Run OCI and S3 contracts plus shared CLI E2E against RustFS
    env:
      ENBU_TEST_OCI_REF: localhost:5002/storage-tests
      ENBU_TEST_S3_ENDPOINT: http://localhost:9002
      ENBU_TEST_S3_BUCKET: enbu-storage-tests
      ENBU_TEST_CREATE_BUCKET: '1'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: enbu-test-access
      AWS_SECRET_ACCESS_KEY: enbu-test-secret
    cmds:
      - docker compose -p enbu-storage -f test/storage/compose.yaml down --volumes --remove-orphans
      - docker compose -p enbu-storage -f test/storage/compose.yaml up -d --wait
      - defer: docker compose -p enbu-storage -f test/storage/compose.yaml down --volumes --remove-orphans
      - curl --fail --silent --show-error --retry-all-errors --retry 50 --retry-delay 1 --retry-connrefused --retry-max-time 50 http://localhost:5002/v2/
      - curl --fail --silent --show-error --retry-all-errors --retry 50 --retry-delay 1 --retry-connrefused --retry-max-time 50 http://localhost:9002/health
      - go test -v -race -count=1 -tags=storagee2e ./pkg/storage -run TestRemoteStorage
      - go test -v -count=1 -tags=fixture,identitye2e ./test/identitye2e -run TestStorageBackendLifecycles

  export/aws/test/e2e:
    desc: Verify AWS Secrets Manager plans through AWS SDK v2 and Kumo
    env:
      ENBU_TEST_KUMO_ENDPOINT: http://localhost:4566
    cmds:
      - docker compose -p enbu-aws -f test/aws/compose.yaml down --volumes --remove-orphans
      - docker compose -p enbu-aws -f test/aws/compose.yaml up -d --wait
      - defer: docker compose -p enbu-aws -f test/aws/compose.yaml down --volumes --remove-orphans
      - >-
        curl --fail --silent --show-error --retry-all-errors --retry 50 --retry-delay 1
        --retry-connrefused --retry-max-time 50
        -H 'Content-Type: application/x-amz-json-1.1'
        -H 'X-Amz-Target: secretsmanager.ListSecrets'
        -d '{}' http://localhost:4566
      - go test -v -race -count=1 -tags=awse2e ./test/aws

  gui/test:
    desc: Run GUI tests
    deps:
      - gui/install
      - gui/build/frontend
    dir: web
    cmds:
      - vp test

  scripts/test:
    desc: Run release automation tests
    dir: scripts
    cmds:
      - uv run pytest

  all/build:
    desc: Build CLI, GUI and the VS Code extension
    deps:
      - cli/build
      - gui/build
      - vscode/build

  cli/build:
    desc: Build CLI
    deps:
      - gui/build/frontend
    cmds:
      - go build -o enbu .

  gui/build:
    desc: Build GUI desktop app into desktop/wails/build/bin
    deps:
      - gui/build/frontend
      - tools/wails3
    dir: desktop/wails
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "(unset)"
      # macOS bundle versions must be numeric.
      BUNDLE_VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null | sed -E 's/^v//; s/[^0-9.].*$//' | grep . || echo 0.0.0
      LDFLAGS: -s -w -X main.Version={{.VERSION}}
      WAILS3: ../../.tmp/bin/wails3{{exeExt}}
    cmds:
      - mkdir -p build/bin
      - '{{.WAILS3}} generate icons -input ../../assets/icon.png -windowsfilename build/icon.ico -macfilename build/icons.icns'
      - cmd: '{{.WAILS3}} generate syso -arch {{ARCH}} -icon build/icon.ico -manifest packaging/windows/enbu-desktop.exe.manifest -out rsrc_windows_{{ARCH}}.syso'
        platforms: [windows]
      - cmd: go build -tags production -trimpath -ldflags "{{.LDFLAGS}} -H windowsgui" -o build/bin/enbu-desktop.exe .
        platforms: [windows]
      - cmd: go build -tags production -trimpath -ldflags "{{.LDFLAGS}}" -o build/bin/enbu-desktop .
        platforms: [linux, darwin]
      - cmd: |
          app=build/bin/enbu-desktop.app
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          mv build/bin/enbu-desktop "$app/Contents/MacOS/enbu-desktop"
          cp build/icons.icns "$app/Contents/Resources/icons.icns"
          cp packaging/darwin/Info.plist "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "{{.BUNDLE_VERSION}}" "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "{{.BUNDLE_VERSION}}" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
        platforms: [darwin]

  gui/package/linux:
    desc: Package the desktop app that gui/build built as .deb and .rpm into desktop/wails/build/package (Linux)
    dir: desktop/wails
    platforms: [linux]
    vars:
      # Package versions must start with a digit.
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' | grep . || echo 0.0.0
    env:
      VERSION: '{{.VERSION}}'
      ARCH: '{{ARCH}}'
    cmds:
      - mkdir -p build/package
      - nfpm package --config packaging/linux/nfpm.yaml --packager deb --target build/package/
      - nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target build/package/

  gui/run:
    desc: Run GUI desktop app against the Vite dev server (frontend hot reload; Ctrl-C stops both)
    deps:
      - gui/run/frontend
      - gui/run/app

  gui/run/frontend:
    internal: true
    deps:
      - gui/build/frontend
    dir: web
    cmds:
      - vp dev --port 5173 --strictPort

  gui/run/app:
    internal: true
    deps:
      - gui/build/frontend
    dir: desktop/wails
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "(unset)"
    env:
      FRONTEND_DEVSERVER_URL: http://localhost:5173
    cmds:
      - curl --fail --silent --output /dev/null --retry 60 --retry-delay 1 --retry-connrefused http://localhost:5173/
      - go run -ldflags "-X main.Version={{.VERSION}}" .

  gui/bindings:
    desc: Regenerate the frontend's TypeScript bindings of the desktop service (web/src/bindings)
    deps:
      - gui/build/frontend
      - tools/wails3
    dir: desktop/wails
    cmds:
      - ../../.tmp/bin/wails3{{exeExt}} generate bindings -silent -ts -d ../../web/src/bindings .

  tools/wails3:
    internal: true
    run: once
    sources:
      - tools/wails3/go.mod
      - tools/wails3/go.sum
    generates:
      - .tmp/bin/wails3{{exeExt}}
    cmds:
      - go build -C tools/wails3 -o ../../.tmp/bin/wails3{{exeExt}} github.com/wailsapp/wails/v3/cmd/wails3

  all/check:
    desc: Format and lint all code
    deps:
      - cli/check
      - gui/check
      - vscode/check
      - scripts/check

  cli/check:
    desc: Format and lint CLI code
    deps:
      - gui/build/frontend
    cmds:
      - go run ./tools/apperrlint .
      - golangci-lint run --fix --build-tags fixture ./...
      - golangci-lint fmt ./...
      - git diff --exit-code -- '*.go'

  cli/vuln:
    desc: Scan Go dependencies and the standard library for known vulnerabilities
    cmds:
      - govulncheck -tags fixture ./...

  gui/check:
    desc: Format and lint GUI code, and check the generated bindings are current
    deps:
      - gui/install
      - gui/build/frontend
    cmds:
      - task: gui/bindings
      - git diff --exit-code -- web/src/bindings
      - test -z "$(git status --porcelain -- web/src/bindings)"
      - cd web && vp check

  vscode/test:
    desc: Run VS Code extension tests
    deps:
      - vscode/install
    dir: vscode
    cmds:
      - vp test

  vscode/check:
    desc: Format and lint VS Code extension code
    deps:
      - vscode/install
    dir: vscode
    cmds:
      - vp check

  vscode/build:
    desc: Build the VS Code extension into vscode/dist and vscode/media
    deps:
      - vscode/install
      - vscode/build/frontend
    dir: vscode
    cmds:
      - vp run build

  vscode/package:
    desc: Package the VS Code extension with this machine's enbu as vscode/enbu-vscode.vsix
    deps:
      - vscode/build
      - cli/build
    dir: vscode
    cmds:
      - node scripts/package.mjs --enbu ../enbu --out enbu-vscode.vsix

  vscode/install:
    internal: true
    run: once
    dir: vscode
    cmds:
      - task: vp/env
      - vp install --frozen-lockfile

  vscode/build/frontend:
    internal: true
    run: once
    dir: web
    cmds:
      # Both builds regenerate web/styled-system with --clean, so they must not
      # run at once (vscode/package builds the CLI, which needs gui/build/frontend).
      - task: gui/build/frontend
      - vp run build:vscode
    status:
      - test "${ENBU_FRONTEND_PREBUILT:-}" = "1"
      - test -f dist-vscode/index.html

  # Release assets that anyone can rebuild bit for bit from the tag: the CLI
  # archives and packages, the Windows desktop app and the VS Code extensions.
  # The release workflow builds them with this task and, on another runner,
  # builds them again and compares (docs/reproducible-builds.md).
  release/build:
    desc: Build the reproducible release assets of tag VERSION (a tag on HEAD) into dist/ and list them in dist/reproducible.sha256
    requires:
      vars: [VERSION]
    cmds:
      - task: release/cli
      - task: release/desktop/windows
        vars: { GOARCH: amd64 }
      - task: release/desktop/windows
        vars: { GOARCH: arm64 }
      - task: release/vscode
      - |
        set -eu -o pipefail
        cd dist
        sha256sum enbu_*.tar.gz enbu_*.zip enbu_*.deb enbu_*.rpm enbu_*.apk enbu_*.pkg.tar.zst \
          enbu-desktop_*_windows_*.zip enbu-vscode_*.vsix | LC_ALL=C sort -k2 > reproducible.sha256

  release/cli:
    internal: true
    env:
      GORELEASER_CURRENT_TAG: '{{.VERSION}}'
    cmds:
      - goreleaser release --clean --skip=publish

  # The Windows app uses no cgo, so it is cross-built here like the CLI and
  # does not depend on a Windows runner's toolchain.
  release/desktop/windows:
    internal: true
    deps:
      - gui/build/frontend
      - tools/wails3
    dir: desktop/wails
    vars:
      WAILS3: ../../.tmp/bin/wails3{{exeExt}}
      STAGE: ../../.tmp/release/windows_{{.GOARCH}}
    env:
      SOURCE_DATE_EPOCH: '{{.SOURCE_DATE_EPOCH}}'
    cmds:
      - rm -rf {{.STAGE}} && mkdir -p build {{.STAGE}}
      - '{{.WAILS3}} generate icons -input ../../assets/icon.png -windowsfilename build/icon.ico -macfilename build/icons.icns'
      - '{{.WAILS3}} generate syso -arch {{.GOARCH}} -icon build/icon.ico -manifest packaging/windows/enbu-desktop.exe.manifest -out rsrc_windows_{{.GOARCH}}.syso'
      - CGO_ENABLED=0 GOOS=windows GOARCH={{.GOARCH}} go build -tags production -trimpath -ldflags "-s -w -X main.Version={{.VERSION}} -H windowsgui" -o {{.STAGE}}/enbu-desktop.exe .
      - go run ../../tools/reproarchive zip ../../dist/enbu-desktop_{{.VERSION}}_windows_{{.GOARCH}}.zip {{.STAGE}}

  # One VSIX per VS Code target, each carrying the CLI binary of release/cli
  # for that platform; reproarchive rezip drops the file times vsce writes.
  release/vscode:
    internal: true
    deps:
      - vscode/build
    env:
      SOURCE_DATE_EPOCH: '{{.SOURCE_DATE_EPOCH}}'
    cmds:
      - for: [linux_amd64:linux-x64, linux_arm64:linux-arm64, darwin_amd64:darwin-x64, darwin_arm64:darwin-arm64, windows_amd64:win32-x64, windows_arm64:win32-arm64]
        cmd: |
          set -eu
          suffix="{{splitList ":" .ITEM | first}}"
          target="{{splitList ":" .ITEM | last}}"
          bin_dir=".tmp/release/enbu-$suffix"
          rm -rf "$bin_dir" && mkdir -p "$bin_dir"
          case "$suffix" in
            windows_*) unzip -q -o -j "dist/enbu_{{.VERSION}}_$suffix.zip" enbu.exe -d "$bin_dir"; binary="$bin_dir/enbu.exe" ;;
            *) tar -xzf "dist/enbu_{{.VERSION}}_$suffix.tar.gz" -C "$bin_dir" enbu; binary="$bin_dir/enbu" ;;
          esac
          out="dist/enbu-vscode_{{.VERSION}}_$suffix.vsix"
          node vscode/scripts/package.mjs --enbu "$binary" --target "$target" --version "{{.VERSION}}" --out "$out"
          go run ./tools/reproarchive rezip "$out"

  scripts/check:
    desc: Check Python formatting and lint
    dir: scripts
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .

  scripts/fmt:
    desc: Format Python release automation
    dir: scripts
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  scripts/lint:
    desc: Lint Python release automation
    dir: scripts
    cmds:
      - uv run ruff check .

  gui/preview:
    desc: Build GUI frontend in mock/preview mode
    deps:
      - gui/install
    dir: web
    cmds:
      - vp run build:preview

  # vp env off rewrites one global Vite+ config file; gui/install and
  # vscode/install run in parallel, so they share one run.
  vp/env:
    internal: true
    run: once
    cmds:
      - vp env off

  frontend/build:
    desc: Build desktop and VS Code frontend bundles for shared CI artifacts
    cmds:
      - task: vscode/build/frontend

  frontend/build/desktop:
    desc: Build the desktop frontend bundle for shared Go embed artifacts
    cmds:
      - task: gui/build/frontend

  frontend/install:
    desc: Prepare both frontend dependency trees before parallel CI readers
    deps:
      - gui/install
      - vscode/install

  gui/install:
    internal: true
    run: once
    dir: web
    cmds:
      - task: vp/env
      - vp install --frozen-lockfile

  gui/build/frontend:
    internal: true
    run: once
    dir: web
    cmds:
      - task: gui/install
      - vp run build
    # The release workflow builds the frontend once and downloads web/dist into
    # every desktop build job; ENBU_FRONTEND_PREBUILT=1 skips the rebuild there.
    status:
      - test "${ENBU_FRONTEND_PREBUILT:-}" = "1"
      - test -f dist/index.html
