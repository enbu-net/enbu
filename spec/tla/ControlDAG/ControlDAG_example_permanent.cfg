\* Example, not a mutant: the implementation itself. A fork whose heads share
\* no admin is never joined (two admins removing each other, or a removed
\* admin signing children of the Controls it still administers). TLC is
\* expected to report EveryForkJoined violated with a lasso that stays forked.
\* expect: violation EveryForkJoined
\* trace: ControlDAG_example_permanent.txt
CONSTANTS
  Admins = {a1, a2}
  Evil = e
  Member = m
  Outsider = x
  MaxSteps = 2
  Bug = "none"
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
PROPERTY EveryForkJoined
