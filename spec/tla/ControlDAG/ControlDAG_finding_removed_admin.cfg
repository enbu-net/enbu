\* Finding, not a mutant: the implementation itself. After an honest admin
\* removed Evil, Evil still signs a child of a Control that listed it as an
\* admin, and it verifies. TLC is expected to report RemovedAdminSignsNothing
\* violated. Together with ControlDAG_example_permanent.cfg this shows a
\* removed admin with storage write access can fork the Control for good.
\* expect: violation RemovedAdminSignsNothing
\* trace: ControlDAG_finding_removed_admin.txt
CONSTANTS
  Admins = {a1, a2}
  Evil = e
  Member = m
  Outsider = x
  MaxSteps = 2
  Bug = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT RemovedAdminSignsNothing
