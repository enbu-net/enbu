\* Nightly tier: four honest revisions, concurrent heads, a removal and compaction, with
\* storage that hides and replays revisions; no attacker key.
CONSTANTS
    Writers = {"a", "b"}
    Compromised = {"r"}
    Reader = "a"
    Members <- MCRemoval
    MaxRevisions = 4
    MaxAttacks = 0
    MaxGen = 3
    Compaction = TRUE
    Witnessing = FALSE
    Conformance = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttackerContentAdopted
INVARIANT HonestNeverBuildsOnAttacker
INVARIANT NoUndetectedRollback
INVARIANT JunkDoesNotInterfere
INVARIANT TrustedContentReadable
INVARIANT HonestGenerations
CHECK_DEADLOCK FALSE
