\* revisions must stay set aside (ADR-19).
CONSTANTS
    Writers = {"a", "b"}
    Compromised = {"r"}
    Reader = "a"
    Members <- MCReadmission
    MaxRevisions = 3
    MaxAttacks = 1
    MaxGen = 2
    Compaction = FALSE
    Witnessing = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttackerContentAdopted
INVARIANT HonestNeverBuildsOnAttacker
INVARIANT NoUndetectedRollback
INVARIANT JunkDoesNotInterfere
INVARIANT TrustedContentReadable
INVARIANT HonestGenerations
CHECK_DEADLOCK FALSE
