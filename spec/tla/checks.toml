name = "StateDAG attacker deep"
module = "MCStateDAG.tla"
config = "StateDAG_deep.cfg"
tier = "nightly"
min_states = 500000

[[model]]
name = "StateDAG honest writers deep"
module = "MCStateDAG.tla"
config = "StateDAG_honest_deep.cfg"
tier = "nightly"
uncovered = ["Attack"]
min_states = 400000

[[model]]
name = "MemberChange deep"
module = "MemberChange.tla"
config = "MemberChange_fork_deep.cfg"
tier = "nightly"
min_states = 1000000
