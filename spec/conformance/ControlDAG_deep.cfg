\* Nightly tier: five Controls, three honest changes, an attack and the reader at once.
CONSTANTS
    Devices = {"a", "b", "m"}
    Honest = {"a", "b"}
    Compromised = {"m"}
    Reader = "a"
    GenesisRoles <- MCGenesisRoles
    MaxControls = 5
    MaxChanges = 3
    MaxAttacks = 1
    ReaderActs = TRUE
    PromoteCompromised = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT OnlyHonestControlsVerify
INVARIANT ChildrenSignedByAdminsOfEveryParent
INVARIANT ResolutionsStayInsideParents
INVARIANT HonestResolutionIsIntersection
INVARIANT NoSessionWhileForked
INVARIANT AcceptedNeverHidden
INVARIANT CheckpointOnlyVerified
INVARIANT ForkCanBeJoined
CHECK_DEADLOCK FALSE
