# Checks that tools/formalcheck runs (task formal/check).
#
# Each model runs once and must pass with every action taken at least once.
# Each mutant seeds one bug through the model's Mutant constant and must be
# caught by one of the listed properties. Each witness is an invariant that
# must be violated, which proves the configuration reaches what the
# properties are about. Tier "pr" runs on every pull request; "nightly" runs
# the same properties with larger bounds.

[[model]]
name = "ControlDAG authority"
module = "MCControlDAG.tla"
config = "ControlDAG.cfg"
tier = "pr"
uncovered = ["ReaderStep"]
min_states = 100000
  [[model.mutant]]
  name = "skip-signature"
  violates = ["OnlyHonestControlsVerify"]
  [[model.mutant]]
  name = "resolve-union"
  violates = ["HonestResolutionIsIntersection"]
  [[model.witness]]
  invariant = "WitnessNoFork"
  [[model.witness]]
  invariant = "WitnessNoJoin"
  [[model.witness]]
  invariant = "WitnessNoAttackStored"

[[model]]
name = "ControlDAG leaked admin key"
module = "MCControlDAG.tla"
config = "ControlDAG_insider.cfg"
tier = "pr"
uncovered = ["ReaderStep"]
min_states = 100000
  [[model.mutant]]
  name = "any-parent-admin"
  violates = ["ChildrenSignedByAdminsOfEveryParent"]
  [[model.mutant]]
  name = "skip-resolution-check"
  violates = ["ResolutionsStayInsideParents"]
  # The verifier before F4 accepted any subset of the heads' union.
  [[model.mutant]]
  name = "union-resolution"
  violates = ["ResolutionsStayInsideParents"]

[[model]]
name = "ControlDAG reader checkpoint"
module = "MCControlDAG.tla"
config = "ControlDAG_reader.cfg"
tier = "pr"
uncovered = ["Attack"]
min_states = 10000
  [[model.mutant]]
  name = "skip-checkpoint"
  violates = ["AcceptedNeverHidden"]
  [[model.mutant]]
  name = "forked-proceeds"
  violates = ["NoSessionWhileForked"]
  [[model.witness]]
  invariant = "WitnessNoForkedOpen"

[[model]]
name = "StateDAG attacker"
module = "MCStateDAG.tla"
config = "StateDAG.cfg"
tier = "pr"
min_states = 50000
  [[model.mutant]]
  name = "count-untrusted"
  violates = ["NoUndetectedRollback"]
  # F2b: counting every proven revision, whoever signed it, still lets a
  # removed member's key mask a rollback (spec/INVARIANTS.md).
  [[model.mutant]]
  name = "count-proven"
  violates = ["NoUndetectedRollback"]
  [[model.mutant]]
  name = "abort-on-unknown-control"
  violates = ["JunkDoesNotInterfere"]
  [[model.mutant]]
  name = "trust-every-signed"
  violates = ["NoAttackerContentAdopted", "HonestNeverBuildsOnAttacker"]
  [[model.mutant]]
  name = "skip-checkpoint"
  violates = ["NoUndetectedRollback"]
  [[model.mutant]]
  name = "no-fallback"
  violates = ["TrustedContentReadable"]
  [[model.witness]]
  invariant = "WitnessNoRollbackRefused"
  [[model.witness]]
  invariant = "WitnessNoSetAside"

[[model]]
name = "StateDAG honest writers"
module = "MCStateDAG.tla"
config = "StateDAG_honest.cfg"
tier = "pr"
uncovered = ["Attack"]
min_states = 10000
  [[model.mutant]]
  name = "skip-checkpoint"
  violates = ["NoUndetectedRollback"]
  [[model.witness]]
  invariant = "WitnessNoAdoption"
  [[model.witness]]
  invariant = "WitnessNoConcurrentHeads"
  [[model.witness]]
  invariant = "WitnessNoCompaction"

[[model]]
name = "StateDAG readmission"
module = "MCStateDAG.tla"
config = "StateDAG_rejoin.cfg"
tier = "pr"
uncovered = ["CompactStep"]
min_states = 10000
  [[model.mutant]]
  name = "skip-continuity"
  violates = ["NoAttackerContentAdopted", "HonestNeverBuildsOnAttacker"]

[[model]]
name = "MemberChange removal races writers"
module = "MemberChange.tla"
config = "MemberChange.cfg"
tier = "pr"
uncovered = ["BApprove", "BSync", "Resolve", "Sync", "ADoneOk"]
min_states = 5000
  [[model.mutant]]
  name = "control-before-reencrypt"
  violates = ["NoLostUpdate"]
  [[model.mutant]]
  name = "reencrypt-for-everyone"
  violates = ["SettledHeadsExcludeRemovedUnlessRaced"]
  [[model.mutant]]
  name = "forget-published"
  violates = ["NoSelfConflict"]
  [[model.witness]]
  invariant = "WitnessNoRetry"
  [[model.witness]]
  invariant = "WitnessNoOverlap"
  [[model.witness]]
  invariant = "WitnessNotSettled"
  # RCPT-3: a write racing the removal leaves a head still encrypted for the
  # removed member until the next write or sync (documented limitation).
  [[model.witness]]
  invariant = "SettledHeadsExcludeRemoved"

[[model]]
name = "MemberChange removal races an approval"
module = "MemberChange.tla"
config = "MemberChange_fork.cfg"
tier = "pr"
uncovered = ["ADoneOk"]
min_states = 5000
  [[model.mutant]]
  name = "moved-is-internal"
  violates = ["NoInternalErrors"]
  [[model.mutant]]
  name = "skip-recheck-after-publish"
  violates = ["SettledHeadsReadable"]
  [[model.witness]]
  invariant = "WitnessNoFork"
  [[model.witness]]
  invariant = "WitnessNoJoin"
  [[model.witness]]
  invariant = "WitnessNoRetry"
  # F7: a write that gives up after publishing leaves a revision a member
  # approved meanwhile cannot decrypt until the next write or sync.
  [[model.witness]]
  invariant = "SettledHeadsReadableStrict"

[[model]]
name = "Founding against an attacker"
module = "Founding.tla"
config = "Founding.cfg"
tier = "pr"
uncovered = ["OtherFound", "Confirm", "AcceptNew", "SaveEarly", "PinRepo"]
min_states = 5000
  [[model.mutant]]
  name = "split-pin"
  violates = ["NoAttackerRootAfterPin"]
  [[model.mutant]]
  name = "found-over-others"
  violates = ["NeverFoundOverOthers"]
  [[model.mutant]]
  name = "adopt-any-genesis"
  violates = ["FoundedIsOwn", "NoAttackerRootAfterPin"]
  [[model.mutant]]
  name = "pin-before-verify"
  violates = ["OnlyVerifiedPinned"]
  [[model.mutant]]
  name = "founded-without-author-check"
  violates = ["NoAttackerRootAfterPin", "FoundedIsOwn"]
  [[model.witness]]
  invariant = "WitnessNoSession"
  [[model.witness]]
  invariant = "WitnessNoRefusal"
  [[model.witness]]
  invariant = "WitnessNoConcurrentFounding"

[[model]]
name = "Founding concurrent and re-founded"
module = "Founding.tla"
config = "Founding_refound.cfg"
tier = "pr"
uncovered = ["EditStep", "AttackPublish", "AttackRequest", "SaveEarly", "PinRepo"]
min_states = 500
  [[model.witness]]
  invariant = "WitnessNoReplace"
  [[model.witness]]
  invariant = "WitnessNoConcurrentFounding"

[[model]]
name = "Founding with crashes"
module = "Founding.tla"
config = "Founding_crash.cfg"
tier = "pr"
uncovered = ["EditStep", "AttackPublish", "AttackRequest", "OtherFound", "Confirm", "AcceptNew", "SaveEarly", "PinRepo"]
min_states = 50
  [[model.mutant]]
  name = "toml-before-publish"
  violates = ["TomlNamesPublished", "HonestFoundingSucceeds"]
  [[model.witness]]
  invariant = "WitnessNoLostReply"

# Nightly: the same properties with larger bounds.

[[model]]
name = "ControlDAG deep"
module = "MCControlDAG.tla"
config = "ControlDAG_deep.cfg"
tier = "nightly"
min_states = 1000000

[[model]]
name = "StateDAG attacker deep"
module = "MCStateDAG.tla"
config = "StateDAG_deep.cfg"
tier = "nightly"
min_states = 500000

[[model]]
name = "StateDAG honest writers deep"
module = "MCStateDAG.tla"
config = "StateDAG_honest_deep.cfg"
tier = "nightly"
uncovered = ["Attack"]
min_states = 400000

[[model]]
name = "MemberChange deep"
module = "MemberChange.tla"
config = "MemberChange_fork_deep.cfg"
tier = "nightly"
# As in the PR approval-race config, only the control-before-reencrypt mutant
# enters done-ok. The fixed removal finishes directly in ARemove.
uncovered = ["ADoneOk"]
min_states = 1000000

[[model]]
name = "Founding deep"
module = "Founding.tla"
config = "Founding_deep.cfg"
tier = "nightly"
uncovered = ["OtherFound", "Confirm", "AcceptNew", "SaveEarly", "PinRepo"]
min_states = 20000
