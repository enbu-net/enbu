name: Setup workload tools
description: Cache only tools requested by this workload, with the same root on every OS
inputs:
  cache-scope:
    description: Isolated tool population; no fallback to another workload's large cache
    default: ${{ github.job }}
runs:
  using: composite
  steps:
    - name: Select isolated aqua root
      shell: bash
      run: echo "AQUA_ROOT_DIR=$RUNNER_TEMP/enbu-aqua" >> "$GITHUB_ENV"
    - uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/enbu-aqua
        key: v3-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('aqua.yaml', '.github/actions/setup-tools/action.yaml') }}
    # A cached root already holds this aqua version, so only a cold cache
    # downloads from GitHub Releases. Those downloads fail with 504 for minutes
    # at a time; one delayed retry keeps an outage from failing the job.
    - id: aqua
      uses: aquaproj/aqua-installer@v4.1.1
      continue-on-error: true
      with:
        aqua_version: v2.66.1
        skip_install_aqua: "true"
    - name: Wait before retrying aqua
      if: steps.aqua.outcome == 'failure'
      shell: bash
      run: sleep 90
    - name: Retry aqua
      if: steps.aqua.outcome == 'failure'
      uses: aquaproj/aqua-installer@v4.1.1
      with:
        aqua_version: v2.66.1
        skip_install_aqua: "true"
