name: Setup frontend toolchain
description: Restore the content-addressed dependency store using the web lockfile
inputs:
  cache:
    description: Restore and save the dependency store; "false" downloads everything
    default: "true"
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1.22.0
      with:
        working-directory: web
        run-install: false
        package-manager: false
        node-manager: false
        cache: ${{ inputs.cache == 'true' }}
