name: Install desktop build dependencies
description: Install the GTK 4 and WebKitGTK 6.0 headers the Wails v3 desktop app links against on Linux

runs:
  using: composite
  steps:
    # The packages weigh over 100 MB, and a slow Ubuntu mirror has stalled
    # their download past job timeouts. The downloaded .deb files are cached;
    # apt fetches only the ones a package update made stale.
    - name: Read the Ubuntu release
      id: release
      if: runner.os == 'Linux'
      shell: bash
      run: |
        . /etc/os-release
        echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"
    - name: Cache GTK 4 and WebKitGTK 6.0 packages
      if: runner.os == 'Linux'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/desktop-deps-apt
        key: desktop-deps-apt-ubuntu${{ steps.release.outputs.version }}-${{ runner.arch }}-${{ hashFiles('.github/actions/desktop-deps/action.yaml') }}
    - name: Install GTK 4 and WebKitGTK 6.0
      if: runner.os == 'Linux'
      shell: bash
      run: |
        archives="$HOME/.cache/desktop-deps-apt"
        mkdir -p "$archives/partial"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          -o Dir::Cache::Archives="$archives" \
          -o APT::Keep-Downloaded-Packages=true \
          -o Acquire::Retries=3 \
          libgtk-4-dev libwebkitgtk-6.0-dev
        # apt writes as root; the cache step saves as the runner user.
        sudo rm -f "$archives/lock"
        sudo chown -R "$(id -u):$(id -g)" "$archives"
