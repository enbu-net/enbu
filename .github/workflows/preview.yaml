name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-pages
  cancel-in-progress: false

jobs:
  build-web:
    name: Build Web Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build preview
        run: pnpm run build:preview
        working-directory: web
        env:
          PREVIEW_BASE: /enbu/web/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-preview
          path: web/dist-preview
          retention-days: 1

  build-tui:
    name: Build TUI Preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore browser VM cache
        id: browser-vm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/preview/out/tui/out.wasm.gz
          key: tui-vm-${{ runner.os }}-c2w-v0.8.4-${{ hashFiles('go.mod', 'go.sum', '**/*.go', 'test/preview/Dockerfile.tui') }}

      - name: Build TUI demo binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o tui-demo ./test/preview/tui-demo

      - name: Build TUI container
        if: steps.browser-vm-cache.outputs.cache-hit != 'true'
        run: docker build -f test/preview/Dockerfile.tui -t enbu-tui-preview:local .

      - name: Install container2wasm
        if: steps.browser-vm-cache.outputs.cache-hit != 'true'
        env:
          C2W_VERSION: v0.8.4
          C2W_COMMIT: 6ed3d98882a2b22eafc1334f574c364a5b2b8c47
        run: |
          curl -fsSL "https://github.com/container2wasm/container2wasm/releases/download/${C2W_VERSION}/container2wasm-${C2W_VERSION}-linux-amd64.tar.gz" -o /tmp/c2w.tar.gz
          echo "1142ab95212578c0c7f666de830de6945f2abbea1713d1e07a7cb04072e00f31  /tmp/c2w.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/c2w.tar.gz c2w
          curl -fsSL "https://github.com/container2wasm/container2wasm/archive/${C2W_COMMIT}.tar.gz" -o /tmp/c2w-assets.tar.gz
          echo "4815b8923167732ad53a8b60492395c6b0a9ff3d14cc2ac7fa08afab48e47bc5  /tmp/c2w-assets.tar.gz" | sha256sum -c -
          mkdir -p /tmp/c2w-assets
          tar -xzf /tmp/c2w-assets.tar.gz -C /tmp/c2w-assets --strip-components=1

      - name: Build browser VM
        if: steps.browser-vm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p test/preview/out/tui
          c2w --assets /tmp/c2w-assets enbu-tui-preview:local test/preview/out/tui/out.wasm
          gzip -9 test/preview/out/tui/out.wasm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-preview
          path: test/preview/out
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-web, build-tui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-preview
          path: site/web

      - name: Download TUI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tui-preview
          path: site

      - name: Copy preview page
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            test/preview/index.html
            test/preview/coi-serviceworker.min.js
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false

      - run: cp src/test/preview/index.html site/index.html

      - name: Copy cross-origin isolation worker
        run: cp src/test/preview/coi-serviceworker.min.js site/coi-serviceworker.min.js

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
