name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  build-web:
    name: Build Web Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build preview
        run: pnpm run build:preview
        working-directory: web
        env:
          PREVIEW_BASE: /enbu/web/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-preview
          path: web/dist-preview
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: web-preview
          path: site/web

      - name: Copy preview page
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            test/preview/index.html
            test/preview/preview-metadata.js
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false

      - run: cp src/test/preview/index.html site/index.html

      - run: cp src/test/preview/preview-metadata.js site/preview-metadata.js

      - name: Write preview environment metadata
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
          PREVIEW_REF: ${{ github.head_ref }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n \
            --arg pullRequest "$PREVIEW_PR" \
            --arg pullRequestURL "$PREVIEW_PR_URL" \
            --arg ref "$PREVIEW_REF" \
            --arg sha "$PREVIEW_SHA" \
            '{pullRequest: $pullRequest, pullRequestURL: $pullRequestURL, ref: $ref, sha: $sha}' \
            > site/preview-metadata.json

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
