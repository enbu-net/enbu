name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  build-web:
    name: Build Web Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build preview
        run: pnpm run build:preview
        working-directory: web
        env:
          PREVIEW_BASE: /enbu/web/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-preview
          path: web/dist-preview
          retention-days: 1

  build-tui:
    name: Build TUI Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build TUI WASI module
        run: |
          ./test/preview/build-wasi.sh test/preview/out/tui/out.wasm
          gzip -9 test/preview/out/tui/out.wasm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-preview
          path: test/preview/out
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-web, build-tui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-preview
          path: site/web

      - name: Download TUI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tui-preview
          path: site

      - name: Copy preview page
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            test/preview/index.html
            test/preview/preview-metadata.js
            test/preview/coi-serviceworker.min.js
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false

      - run: cp src/test/preview/index.html site/index.html

      - run: cp src/test/preview/preview-metadata.js site/preview-metadata.js

      - name: Write preview environment metadata
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
          PREVIEW_REF: ${{ github.head_ref }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n \
            --arg pullRequest "$PREVIEW_PR" \
            --arg pullRequestURL "$PREVIEW_PR_URL" \
            --arg ref "$PREVIEW_REF" \
            --arg sha "$PREVIEW_SHA" \
            '{pullRequest: $pullRequest, pullRequestURL: $pullRequestURL, ref: $ref, sha: $sha}' \
            > site/preview-metadata.json

      - name: Copy cross-origin isolation worker
        run: cp src/test/preview/coi-serviceworker.min.js site/coi-serviceworker.min.js

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
