name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Calculate and push tag with svu
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        shell: bash
        run: |
          set -euo pipefail
          new_version="$(svu "$BUMP_TYPE" --tag.pattern 'v[0-9]*.[0-9]*.[0-9]*')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$new_version" >/dev/null 2>&1; then
            echo "Tag $new_version already exists, reusing for idempotent retry"
          else
            git tag "$new_version"
            git push origin "$new_version"
          fi
          printf 'version=%s\n' "$new_version" >> "$GITHUB_OUTPUT"

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [tag]
    if: >-
      always() && (
        needs.tag.result == 'success' ||
        (needs.tag.result == 'skipped' && github.event_name != 'workflow_dispatch')
      )
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - name: Get version
        id: get
        env:
          TAG_VERSION: ${{ needs.tag.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'version=%s\n' "$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  cli:
    name: Build CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [version]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.version }}

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          run-install: false

      - name: Build frontend for Go embed
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error

  desktop:
    name: Build desktop (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [version, frontend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            suffix: windows_amd64
            package: zip
          - os: windows-11-arm
            platform: windows/arm64
            suffix: windows_arm64
            package: zip
          - os: macos-latest
            platform: darwin/arm64
            suffix: darwin_arm64
            package: dmg
          - os: ubuntu-24.04
            platform: linux/amd64
            suffix: linux_amd64
            package: tar.gz
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux_arm64
            package: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          run-install: false

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: web/dist

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Wails app
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXTRA_FLAGS: -s -trimpath
        run: task gui/build PLATFORM="$PLATFORM" EXTRA_FLAGS="$EXTRA_FLAGS"

      - name: Package desktop app
        if: matrix.package == 'tar.gz'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          tar -C desktop/wails/build/bin \
            -czf "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.tar.gz" \
            .

      - name: Package desktop app
        if: matrix.package == 'dmg'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$(find desktop/wails/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p release
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install \
            --disable-pip-version-check \
            dmgbuild==1.6.7
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" \
            -s .github/dmg-settings.py \
            -D app="$app_path" \
            enbu \
            "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.dmg"

      - name: Package desktop app
        if: matrix.package == 'zip'
        shell: pwsh
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $binary = Get-ChildItem desktop/wails/build/bin -Filter *.exe | Select-Object -First 1
          if ($null -eq $binary) {
            throw "Wails did not produce a Windows executable"
          }
          $staging = Join-Path $env:RUNNER_TEMP "enbu-desktop"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item `
            -Path $binary.FullName `
            -Destination (Join-Path $staging "enbu-desktop.exe")
          Compress-Archive `
            -Path (Join-Path $staging "enbu-desktop.exe") `
            -DestinationPath "release/enbu-desktop_${env:VERSION}_${env:DESKTOP_SUFFIX}.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-enbu-desktop-${{ matrix.suffix }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - version
      - cli
      - desktop
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            syft "$artifact" -o spdx-json > "${artifact}.sbom.spdx.json"
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f \
              ! -name '*.sigstore.json' \
              ! -name 'checksums.txt' \
              -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > checksums.txt
          )

      - name: Sign release assets
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign sign-blob \
              --bundle="${artifact}.sigstore.json" \
              "$artifact" \
              --yes
          done

      - name: Generate artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/checksums.txt
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.exe' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.tar.gz' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name '*.sbom.spdx.json' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name '*.sigstore.json' | wc -l)" -gt 0
          (cd release-assets && sha256sum -c checksums.txt)

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$VERSION" \
            --jq .body > generated-notes.md
          python3 scripts/generate_release_notes.py \
            --assets-dir release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$VERSION" \
            --generated-notes generated-notes.md \
            > release-notes.md

      - name: Create draft release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" release-assets/* \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release edit "$VERSION" --draft=false

      - name: Generate GitHub App token for homebrew-tap
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Trigger homebrew-tap update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/enbu-net/homebrew-tap/dispatches \
            --method POST \
            -f event_type=enbu-released
