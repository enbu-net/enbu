name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A release starts from the GitHub web UI: Actions > Release > Run workflow on
  # main, pick the bump. This job tags HEAD of main and every later job builds,
  # signs, attests and publishes that tag. A pushed v* tag skips the tagging.
  version:
    name: Resolve release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Run the release from main, not $REF"
          exit 1

      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/cache@v6.1.0
        if: github.event_name == 'workflow_dispatch'
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@v4.1.1
        if: github.event_name == 'workflow_dispatch'
        with:
          aqua_version: v2.65.2

      - name: Tag HEAD with the next version
        id: tag
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            printf 'version=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='v[0-9]*.[0-9]*.[0-9]*'
          # A run that failed after tagging left its tag on HEAD: release that
          # tag again instead of skipping a version.
          version="$(git tag --points-at HEAD --list "$pattern" --sort=-v:refname | head -n 1)"
          if [ -n "$version" ]; then
            if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::HEAD of main is already released as $version"
              exit 1
            fi
            echo "Reusing unreleased tag $version"
          else
            version="$(svu "$BUMP_TYPE" --tag.pattern "$pattern")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$version"
            # persist-credentials: false leaves no stored credential, so pass the token explicitly.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$version"
            echo "Created $version"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  # Build and attest live in a reusable workflow so the signer identity is
  # release-build.yaml alone (SLSA Build L3); this workflow only publishes.
  build:
    name: Build and attest
    needs: [version]
    uses: ./.github/workflows/release-build.yaml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  release:
    name: Publish immutable release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs:
      - version
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download attested assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: attested-assets
          path: release-assets

      # Fail before anything is published if an asset cannot be verified the way
      # users will verify it: provenance signed by release-build.yaml of this repo.
      - name: Verify attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-build.yaml"
          done < <(
            find release-assets -maxdepth 1 -type f \
              ! -name '*.sigstore.json' \
              ! -name 'checksums.txt' \
              -print0
          )

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$VERSION" \
            --jq .body > generated-notes.md
          python3 scripts/generate_release_notes.py \
            --assets-dir release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$VERSION" \
            --generated-notes generated-notes.md \
            > release-notes.md

      - name: Create draft release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" release-assets/* \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release edit "$VERSION" --draft=false

      - name: Generate GitHub App token for homebrew-tap
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Trigger homebrew-tap update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/enbu-net/homebrew-tap/dispatches \
            --method POST \
            -f event_type=enbu-released
