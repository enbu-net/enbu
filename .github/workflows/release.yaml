name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0

      - name: Calculate and push tag with svu
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          new_version="$(svu "$BUMP_TYPE" --tag.pattern 'v[0-9]*.[0-9]*.[0-9]*')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$new_version" >/dev/null 2>&1; then
            echo "Tag $new_version already exists, reusing for idempotent retry"
          else
            git tag "$new_version"
            # persist-credentials: false leaves no stored credential, so pass the token explicitly.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$new_version"
          fi
          printf 'version=%s\n' "$new_version" >> "$GITHUB_OUTPUT"

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [tag]
    if: >-
      always() && (
        needs.tag.result == 'success' ||
        (needs.tag.result == 'skipped' && github.event_name != 'workflow_dispatch')
      )
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - name: Get version
        id: get
        env:
          TAG_VERSION: ${{ needs.tag.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'version=%s\n' "$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  # Build and attest live in a reusable workflow so the signer identity is
  # release-build.yaml alone (SLSA Build L3); this workflow only publishes.
  build:
    name: Build and attest
    needs: [version]
    uses: ./.github/workflows/release-build.yaml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  release:
    name: Publish immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - version
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download attested assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attested-assets
          path: release-assets

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$VERSION" \
            --jq .body > generated-notes.md
          python3 scripts/generate_release_notes.py \
            --assets-dir release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$VERSION" \
            --generated-notes generated-notes.md \
            > release-notes.md

      - name: Create draft release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" release-assets/* \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release edit "$VERSION" --draft=false

      - name: Generate GitHub App token for homebrew-tap
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Trigger homebrew-tap update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/enbu-net/homebrew-tap/dispatches \
            --method POST \
            -f event_type=enbu-released
