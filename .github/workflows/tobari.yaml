name: Coverage

on:
  pull_request:
    # closed only cancels the PR's runs through the concurrency group (see ci.yaml).
    types: [opened, synchronize, reopened, closed]
    # Documentation never changes coverage (same list as scripts/ci_changes.py).
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - LICENSE
      - .coderabbit.yaml
      - .github/pull_request_template.md
  # main gets one nightly report instead of a run per merge, which also keeps
  # the coverage jobs' caches on main warm for pull requests.
  schedule:
    - cron: '0 18 * * *' # 03:00 Asia/Tokyo, after the nightly DST starts
  workflow_dispatch:

permissions: {}

# Each suite runs on its own runner: the Go tests already saturate the runner's CPUs,
# so running suites side by side on one runner (parallel steps) was not faster.
# The report job merges the per-suite Tobari JSON files.
concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  # A manual run on main must not cancel the nightly one, or the reverse.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Go unit coverage
    needs: [embed]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-coverage

      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-embed
          path: web

      - uses: $/.github/actions/desktop-deps

      - name: Collect Go unit coverage
        run: task cli/test/coverage

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-unit
          path: |
            .tmp/coverage/unit/
            .tmp/coverage/unit.json
          if-no-files-found: error
          retention-days: 14

  scenario:
    name: Go scenario coverage
    needs: [embed]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-coverage

      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-embed
          path: web

      - uses: $/.github/actions/desktop-deps

      - name: Collect Go scenario coverage
        run: task cli/test/coverage/scenario

      - name: Upload scenario coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-scenario
          path: |
            .tmp/coverage/scenario/
            .tmp/coverage/scenario.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: CLI E2E coverage
    if: github.event.action != 'closed'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-coverage

      - name: Install Secret Service
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11

      - name: Collect CLI E2E coverage
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            task cli/test/coverage/e2e
          '

      - name: Upload e2e coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-e2e
          path: |
            .tmp/coverage/e2e/
            .tmp/coverage/e2e.json
          if-no-files-found: error
          retention-days: 14

  identity:
    name: Identity E2E coverage
    if: github.event.action != 'closed'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-coverage

      - name: Install Secret Service
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11

      - name: Collect Identity E2E coverage
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            task identity/test/coverage
          '

      - name: Upload identity coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-identity
          path: |
            .tmp/coverage/identity/
            .tmp/coverage/identity.json
          if-no-files-found: error
          retention-days: 14

  # Keep the build dependency free of tests so React failures cannot skip Go suites.
  embed:
    name: Build shared coverage frontend
    if: github.event.action != 'closed'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-tools
        with:
          cache-scope: frontend
      - uses: $/.github/actions/setup-frontend
      - name: Build shared Go embed frontend
        run: task frontend/build/desktop
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-embed
          compression-level: 1
          path: |
            web/dist
            web/src/routeTree.gen.ts
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: React coverage
    needs: [embed]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools
        with:
          cache-scope: frontend
      - uses: $/.github/actions/setup-frontend
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-embed
          path: web

      - name: Collect React coverage
        run: task gui/test/coverage

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage
          path: |
            .tmp/coverage/frontend/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Tobari Go coverage
    needs: [unit, scenario, e2e, identity]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-coverage

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: .tmp/coverage
          merge-multiple: true

      - name: Merge coverage suites
        run: task coverage/report

      - name: Upload coverage data
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tobari-data
          path: |
            .tmp/coverage/unit/
            .tmp/coverage/scenario/
            .tmp/coverage/e2e/
            .tmp/coverage/identity/
            .tmp/coverage/unit.json
            .tmp/coverage/scenario.json
            .tmp/coverage/e2e.json
            .tmp/coverage/identity.json
            .tmp/coverage/merged.json
            .tmp/coverage/coverage.out
          if-no-files-found: error
          retention-days: 14

      - name: Publish HTML report
        uses: goccy/tobari-action/report@v1.3.0
        with:
          tobari-json: .tmp/coverage/merged.json
          name: tobari-report

  # Required status check for coverage: fails unless every coverage job passed.
  status-check:
    name: Coverage result
    if: always() && github.event.action != 'closed'
    needs: [unit, scenario, e2e, identity, frontend, coverage]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every coverage job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
