name: CI

# Check runs on pull requests, which every change to main goes through, so a
# merge does not run it again. main gets one nightly run instead: it catches
# pull requests that passed against an older main, and it keeps main's caches,
# which every pull request restores from, warm.
on:
  pull_request:
    # closed starts a run in the PR's concurrency group whose jobs all skip:
    # GitHub then cancels the PR's queued and running checks itself, without
    # waiting for a runner the way a cancelling job would.
    types: [opened, synchronize, reopened, closed]
  schedule:
    # Off the hour (GitHub delays on-the-hour schedules by hours), and before
    # the nightly Coverage (23:37) and DST (00:07) runs.
    - cron: '7 14 * * *' # 23:07 Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: read

env:
  AQUA_GITHUB_TOKEN: ${{ github.token }}

# A newer push supersedes the run of the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A manual run on main must not cancel the nightly one, or the reverse.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select jobs
    if: github.event.action != 'closed'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.select.outputs.code }}
    steps:
      # The merge commit of the pull request and its first parent, the base tip.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select jobs from the changed paths
        id: select
        run: python3 scripts/ci_changes.py

  frontend:
    name: Build shared frontend
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools
        with:
          cache-scope: frontend
      - uses: $/.github/actions/setup-frontend
      # Both modes clean styled-system; keep them serial in one producer.
      - name: Build desktop and VS Code frontend modes
        run: task frontend/build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-frontend
          compression-level: 1
          path: |
            web/dist
            web/dist-vscode
            web/src/routeTree.gen.ts
          if-no-files-found: error
          retention-days: 1

  core-native:
    name: Core (${{ matrix.target }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-amd64 is the Unit and component tests job, which runs these
          # packages and every other one with the race detector.
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: windows-amd64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Concurrent composite preparation races the runner's event.json on
      # Windows (run 42394154896 / job 128467827950). Keep Windows setup serial
      # until the runner fixes that shared-file lock; Unix setup remains parallel.
      - parallel:
          - uses: $/.github/actions/setup-go
            if: runner.os != 'Windows'

          - uses: $/.github/actions/setup-tools
            if: runner.os != 'Windows'

      - uses: $/.github/actions/setup-go
        if: runner.os == 'Windows'

      - uses: $/.github/actions/setup-tools
        if: runner.os == 'Windows'

      - name: Test core
        run: task core/test

  identity-e2e:
    name: Identity E2E (${{ matrix.runner }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Concurrent composite preparation races the runner's event.json on
      # Windows (run 42394154896 / job 128467827950). Keep Windows setup serial
      # until the runner fixes that shared-file lock; Unix setup remains parallel.
      - parallel:
          - uses: $/.github/actions/setup-go
            if: runner.os != 'Windows'
          - uses: $/.github/actions/setup-tools
            if: runner.os != 'Windows'

          - name: Install Linux Secret Service
            if: runner.os == 'Linux'
            run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - uses: $/.github/actions/setup-go
        if: runner.os == 'Windows'
      - uses: $/.github/actions/setup-tools
        if: runner.os == 'Windows'

      - name: Identity E2E with unlocked Linux keyring
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            task identity/test/e2e
          '
      - name: Identity E2E with native OS keyring
        if: runner.os != 'Linux'
        run: task identity/test/e2e
      # Linux runs it in the Unit and component tests job.
      - name: Identity package tests
        if: runner.os != 'Linux'
        run: go test -v ./pkg/identity
      # Core runs pkg/storage without cgo, so the race detector covers it here.
      - name: Storage race tests
        if: runner.os != 'Linux'
        run: go test -v -race ./pkg/storage
      # Locks the keyring at the end, so it runs after the steps that need it unlocked.
      - name: Secret Service probe (unlocked, then locked)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            ENBU_TEST_SECRET_SERVICE=unlocked go test -count=1 -v -run SecretService ./pkg/keystore
          '
      - name: Secret Service probe (no Secret Service on the bus)
        if: runner.os == 'Linux'
        run: |
          conf="$RUNNER_TEMP/no-services.conf"
          printf '%s' '<busconfig><type>session</type><listen>unix:tmpdir=/tmp</listen><policy context="default"><allow send_destination="*" eavesdrop="true"/><allow eavesdrop="true"/><allow own="*"/></policy></busconfig>' > "$conf"
          dbus-run-session --config-file="$conf" -- env ENBU_TEST_SECRET_SERVICE=absent go test -count=1 -v -run SecretService ./pkg/keystore

  storage-e2e:
    name: Storage E2E (OCI / RustFS)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - parallel:
          - uses: $/.github/actions/setup-go
          - uses: $/.github/actions/setup-tools

          - name: Install Secret Service
            run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Storage E2E with unlocked keyring
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            task storage/test/e2e
          '

  lint:
    name: Lint
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # After changing uses:, run gh actions-lock and commit actions.lock.
      # Same-repo composite actions use $/ to lock their remote dependencies.
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify workflow dependencies
        run: gh actions-lock --verify --no-interactive
        env:
          GH_TOKEN: ${{ github.token }}

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - uses: actions/download-artifact@v8.0.2
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps

      - uses: $/.github/actions/setup-frontend

      - name: Check
        run: task all/check

      - name: Vulnerability check
        run: task cli/vuln

      - name: Verify no diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --exit-code || true
            echo "::error::CI checks produced file changes. Run 'task all/check' locally and commit the result."
            exit 1
          fi

  test:
    name: Unit and component tests
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - uses: actions/download-artifact@v8.0.2
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps

          # Dependencies and code generation finish before parallel readers start.
      - uses: $/.github/actions/setup-frontend

      - name: Prepare frontend dependencies
        run: task frontend/install
      - parallel:
          - name: Go unit tests
            run: task cli/test/unit
          - name: React tests
            run: task gui/test
          - name: Extension tests and package
            run: |
              task vscode/test
              task vscode/package
          - name: Automation tests
            run: task scripts/test

  desktop:
    name: Desktop build (${{ matrix.runner }})
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Concurrent composite preparation races the runner's event.json on
      # Windows (run 42394154896 / job 128467827950). Keep Windows setup serial
      # until the runner fixes that shared-file lock; Unix setup remains parallel.
      - parallel:
          - uses: $/.github/actions/setup-go
            if: runner.os != 'Windows'

          - uses: $/.github/actions/setup-tools
            if: runner.os != 'Windows'

          - uses: actions/download-artifact@v8.0.2
            if: runner.os != 'Windows'
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps
            if: runner.os != 'Windows'

      - uses: $/.github/actions/setup-go
        if: runner.os == 'Windows'

      - uses: $/.github/actions/setup-tools
        if: runner.os == 'Windows'

      - uses: actions/download-artifact@v8.0.2
        if: runner.os == 'Windows'
        with:
          name: ci-frontend
          path: web

      - uses: $/.github/actions/desktop-deps
        if: runner.os == 'Windows'

      - name: Build desktop app
        shell: bash
        run: task gui/build

      - name: Package desktop app as .deb and .rpm
        if: runner.os == 'Linux'
        run: task gui/package/linux

  scenario:
    name: Scenario tests
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - uses: actions/download-artifact@v8.0.2
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps

      - name: Scenario tests
        run: task cli/test/scenario

  # The required status check of the main ruleset. It keeps the name "Check"
  # so the ruleset needs no change: a PR (Renovate included) merges only after
  # every job above has passed or was left out by the changes job. always()
  # makes a failed or cancelled job fail this check instead of skipping it: a
  # skipped required check counts as passing, so a cancelled run must not be
  # mergeable. A job is skipped only by its changes condition or by a failed or
  # cancelled dependency, which is itself listed here and fails the check.
  status-check:
    name: Check
    if: always() && github.event.action != 'closed'
    needs: [changes, frontend, core-native, identity-e2e, storage-e2e, lint, test, desktop, scenario, renovate-config]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # GitHub creates this check only once every job above has finished, and
      # its page cannot link to the job that failed, so it names the failed jobs
      # (as annotations on the pull request) and links the run.
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and (.key == "changes" or .value.result != "skipped")) | "\(.key)=\(.value.result)"')
          if [ -z "$failed" ]; then
            exit 0
          fi
          while IFS='=' read -r job result; do
            echo "::error title=CI job ${job} ${result:-unknown}::Job '${job}' ended as '${result:-unknown}'. Open it from ${RUN_URL:-the run summary}"
          done <<< "$failed"
          echo "Failed jobs are listed in the run summary: ${RUN_URL:-}"
          exit 1

  renovate-config:
    if: github.event.action != 'closed'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Validate Renovate configuration
        env:
          RENOVATE_VERSION: 44.222.4 # renovate: datasource=npm depName=renovate
        run: npx --yes --package "renovate@$RENOVATE_VERSION" renovate-config-validator --strict renovate.json
