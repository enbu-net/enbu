name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AQUA_GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  # Only superseded PR runs cancel; main commits keep distinct queue slots.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Build shared frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools
        with:
          cache-scope: frontend
      - uses: $/.github/actions/setup-frontend
      # Both modes clean styled-system; keep them serial in one producer.
      - name: Build desktop and VS Code frontend modes
        run: task frontend/build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-frontend
          compression-level: 1
          path: |
            web/dist
            web/dist-vscode
            web/src/routeTree.gen.ts
          if-no-files-found: error
          retention-days: 1

  core-native:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: windows-amd64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Concurrent composite preparation races the runner's event.json on
      # Windows (run 42394154896 / job 128467827950). Keep Windows setup serial
      # until the runner fixes that shared-file lock; Unix setup remains parallel.
      - parallel:
          - uses: $/.github/actions/setup-go
            if: runner.os != 'Windows'

          - uses: $/.github/actions/setup-tools
            if: runner.os != 'Windows'

      - uses: $/.github/actions/setup-go
        if: runner.os == 'Windows'

      - uses: $/.github/actions/setup-tools
        if: runner.os == 'Windows'

      - name: Test core
        run: task core/test

  identity-e2e:
    name: Identity E2E (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Concurrent composite preparation races the runner's event.json on
      # Windows (run 42394154896 / job 128467827950). Keep Windows setup serial
      # until the runner fixes that shared-file lock; Unix setup remains parallel.
      - parallel:
          - uses: $/.github/actions/setup-go
            if: runner.os != 'Windows'
          - uses: $/.github/actions/setup-tools
            if: runner.os != 'Windows'

          - name: Install Linux Secret Service
            if: runner.os == 'Linux'
            run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - uses: $/.github/actions/setup-go
        if: runner.os == 'Windows'
      - uses: $/.github/actions/setup-tools
        if: runner.os == 'Windows'

      - name: Identity E2E with unlocked Linux keyring
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            task identity/test/e2e
          '
      - name: Identity E2E with native OS keyring
        if: runner.os != 'Linux'
        run: task identity/test/e2e
      - name: Identity package tests
        run: go test -v ./pkg/identity
      # Locks the keyring at the end, so it runs after the steps that need it unlocked.
      - name: Secret Service probe (unlocked, then locked)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            ENBU_TEST_SECRET_SERVICE=unlocked go test -count=1 -v -run SecretService ./pkg/keystore
          '
      - name: Secret Service probe (no Secret Service on the bus)
        if: runner.os == 'Linux'
        run: |
          conf="$RUNNER_TEMP/no-services.conf"
          printf '%s' '<busconfig><type>session</type><listen>unix:tmpdir=/tmp</listen><policy context="default"><allow send_destination="*" eavesdrop="true"/><allow eavesdrop="true"/><allow own="*"/></policy></busconfig>' > "$conf"
          dbus-run-session --config-file="$conf" -- env ENBU_TEST_SECRET_SERVICE=absent go test -count=1 -v -run SecretService ./pkg/keystore
      - name: Storage unit tests
        run: go test -v -race ./pkg/storage

  storage-e2e:
    name: Storage E2E (OCI / RustFS)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - parallel:
          - uses: $/.github/actions/setup-go
          - uses: $/.github/actions/setup-tools

          - name: Install Secret Service
            run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Storage E2E with unlocked keyring
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            task storage/test/e2e
          '

  aws-export-e2e:
    name: AWS Secrets Manager export E2E (Kumo)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - parallel:
          - uses: $/.github/actions/setup-go
          - uses: $/.github/actions/setup-tools

      - name: Test core with race detector
        run: go test -race ./pkg/artifact/... ./pkg/content/... ./pkg/schema/secretmap/... ./pkg/schema/opaque/... ./pkg/export/awssecrets/...
      - name: AWS SDK export E2E
        run: task export/aws/test/e2e

  check:
    name: Static checks
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # After changing uses:, run gh actions-lock and commit actions.lock.
      # Same-repo composite actions use $/ to lock their remote dependencies.
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify workflow dependencies
        run: gh actions-lock --verify --no-interactive
        env:
          GH_TOKEN: ${{ github.token }}

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - uses: actions/download-artifact@v8.0.2
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps

      - uses: $/.github/actions/setup-frontend

      - name: Check
        run: task all/check

      - name: Vulnerability check
        run: task cli/vuln

      - name: Verify no diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --exit-code || true
            echo "::error::CI checks produced file changes. Run 'task all/check' locally and commit the result."
            exit 1
          fi

  test:
    name: Unit and component tests
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - uses: actions/download-artifact@v8.0.2
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps

          # Dependencies and code generation finish before parallel readers start.
      - uses: $/.github/actions/setup-frontend

      - name: Prepare frontend dependencies
        run: task frontend/install
      - parallel:
          - name: Go unit tests
            run: task cli/test/unit
          - name: React tests
            run: task gui/test
          - name: Extension tests and package
            run: |
              task vscode/test
              task vscode/package
          - name: Automation tests
            run: task scripts/test

  desktop:
    name: Desktop build (${{ matrix.runner }})
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Concurrent composite preparation races the runner's event.json on
      # Windows (run 42394154896 / job 128467827950). Keep Windows setup serial
      # until the runner fixes that shared-file lock; Unix setup remains parallel.
      - parallel:
          - uses: $/.github/actions/setup-go
            if: runner.os != 'Windows'

          - uses: $/.github/actions/setup-tools
            if: runner.os != 'Windows'

          - uses: actions/download-artifact@v8.0.2
            if: runner.os != 'Windows'
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps
            if: runner.os != 'Windows'

      - uses: $/.github/actions/setup-go
        if: runner.os == 'Windows'

      - uses: $/.github/actions/setup-tools
        if: runner.os == 'Windows'

      - uses: actions/download-artifact@v8.0.2
        if: runner.os == 'Windows'
        with:
          name: ci-frontend
          path: web

      - uses: $/.github/actions/desktop-deps
        if: runner.os == 'Windows'

      - name: Build desktop app
        shell: bash
        run: task gui/build

      - name: Package desktop app as .deb and .rpm
        if: runner.os == 'Linux'
        run: task gui/package/linux

  scenario:
    name: Scenario tests
    needs: [frontend]
    env:
      ENBU_FRONTEND_PREBUILT: "1"
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - uses: actions/download-artifact@v8.0.2
            with:
              name: ci-frontend
              path: web

          - uses: $/.github/actions/desktop-deps

      - name: Scenario tests
        run: task cli/test/scenario

  e2e:
    name: CLI E2E tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - name: Install Secret Service
            run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11

      - name: CLI E2E tests
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            task cli/test/e2e
          '

      - name: Upload atago failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: atago-failure-artifacts
          path: .tmp/atago-artifacts
          if-no-files-found: ignore

  # Every release asset (task release/build) must come out the same twice on
  # each platform, once with caches and once without; the cross-built assets
  # also across the two Linux CPU architectures. So a change that breaks
  # reproducibility fails here and not at release time.
  reproducible:
    name: Reproducible build (${{ matrix.suffix }}, cache ${{ matrix.cache }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      XCODE_VERSION: "16.4"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-15, macos-15-intel]
        cache: ["true", "false"]
        include:
          - os: ubuntu-26.04
            suffix: linux_amd64
          - os: ubuntu-26.04-arm
            suffix: linux_arm64
          - os: macos-15
            suffix: darwin_arm64
          - os: macos-15-intel
            suffix: darwin_amd64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go
            with:
              cache: ${{ matrix.cache }}

          - uses: $/.github/actions/setup-tools
            with:
              cache: ${{ matrix.cache }}

          - uses: $/.github/actions/setup-frontend
            with:
              cache: ${{ matrix.cache }}

          - uses: $/.github/actions/desktop-deps

      - name: Select the pinned Xcode
        if: runner.os == 'macOS'
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "Xcode $XCODE_VERSION is not on this runner; it has:"; ls -d /Applications/Xcode*
            exit 1
          fi
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"

      # goreleaser builds a tag; a local one stands in for the release tag.
      - name: Build reproducible assets
        run: |
          git tag v0.0.0
          task release/build VERSION=v0.0.0

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reproducible-${{ matrix.suffix }}-cache-${{ matrix.cache }}
          path: dist/reproducible.sha256
          if-no-files-found: error
          retention-days: 7

  reproducible-compare:
    name: Compare reproducible builds
    needs: [reproducible]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: reproducible-*
          path: builds

      # Every asset must have been built at least twice, always to the same hash.
      - name: Require identical assets
        run: |
          cat builds/*/reproducible.sha256 | awk '
            { count[$2]++ }
            ($2 in sum) && sum[$2] != $1 { print "DIFFERENT: " $2; bad = 1 }
            { sum[$2] = $1 }
            END {
              for (name in count) if (count[name] < 2) { print "BUILT ONCE: " name; bad = 1 }
              exit bad
            }'
          for list in builds/*/reproducible.sha256; do echo "== $list"; cat "$list"; done

  # The required status check of the main ruleset. It keeps the name "Check"
  # so the ruleset needs no change: a PR (Renovate included) merges only after
  # every job above has passed. always() makes a failed, cancelled or skipped
  # job fail this check instead of skipping it: a skipped required check counts
  # as passing, so a cancelled run must not be mergeable.
  status-check:
    name: Check
    if: always()
    needs: [frontend, core-native, identity-e2e, storage-e2e, aws-export-e2e, check, test, desktop, scenario, e2e, reproducible, reproducible-compare, renovate-config]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  renovate-config:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Validate Renovate configuration
        env:
          RENOVATE_VERSION: 44.221.6 # renovate: datasource=npm depName=renovate
        run: npx --yes --package "renovate@$RENOVATE_VERSION" renovate-config-validator --strict renovate.json
