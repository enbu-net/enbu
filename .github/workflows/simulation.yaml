name: Deterministic simulation

on:
  push:
  schedule:
    - cron: '0 17 * * *' # 02:00 Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: read

# Scheduled full exploration must not be cancelled by an incremental push.
concurrency:
  group: simulation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    name: Select affected DST
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      tests: ${{ steps.plan.outputs.tests }}
      mutation: ${{ steps.plan.outputs.mutation }}
      merge: ${{ steps.plan.outputs.merge }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected tests or daily full exploration
        id: plan
        run: python3 scripts/dst_plan.py

  simulation:
    name: Simulation (${{ matrix.platform.target }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: ${{ needs.plan.outputs.mode == 'full' && 360 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: linux-amd64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: windows-amd64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
    env:
      CGO_ENABLED: '0'
      ENBU_SIM_EXPLORE: '1'
      ENBU_SIM_EXHAUSTIVE: ${{ needs.plan.outputs.mode == 'full' && '1' || '0' }}
      ENBU_SIM_CASE_STRIDE: ${{ needs.plan.outputs.mode == 'full' && '1' || '8' }}
      ENBU_SIM_SEEDS: ${{ needs.plan.outputs.mode == 'full' && '256' || '2' }}
      ENBU_SIM_STEPS: ${{ needs.plan.outputs.mode == 'full' && '256' || '32' }}
      ENBU_SIM_SHARDS: '4'
      ENBU_SIM_ARTIFACTS: ${{ github.workspace }}/.tmp/simulation
      DST_TESTS: ${{ needs.plan.outputs.tests }}
      DST_TIMEOUT: ${{ needs.plan.outputs.mode == 'full' && '330m' || '30m' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test affected merge rules
        if: needs.plan.outputs.merge == 'true'
        run: go test -count=1 ./pkg/merge
      # Actions owns concurrency; lanes have disjoint seeds and artifact paths.
      - parallel:
          - name: Explore and replay (lane 0)
            shell: bash
            env:
              ENBU_SIM_SHARD: '0'
              ENBU_SIM_ARTIFACTS: ${{ github.workspace }}/.tmp/simulation/lane-0
            run: |
              mkdir -p "$ENBU_SIM_ARTIFACTS"
              go test -count=1 -p=1 -parallel=1 -timeout="$DST_TIMEOUT" -coverpkg=./app -coverprofile=.tmp/simulation/lane-0/coverage.out -run "$DST_TESTS" -v ./test/simulation
          - name: Explore and replay (lane 1)
            shell: bash
            env:
              ENBU_SIM_SHARD: '1'
              ENBU_SIM_ARTIFACTS: ${{ github.workspace }}/.tmp/simulation/lane-1
            run: |
              mkdir -p "$ENBU_SIM_ARTIFACTS"
              go test -count=1 -p=1 -parallel=1 -timeout="$DST_TIMEOUT" -coverpkg=./app -coverprofile=.tmp/simulation/lane-1/coverage.out -run "$DST_TESTS" -v ./test/simulation
          - name: Explore and replay (lane 2)
            shell: bash
            env:
              ENBU_SIM_SHARD: '2'
              ENBU_SIM_ARTIFACTS: ${{ github.workspace }}/.tmp/simulation/lane-2
            run: |
              mkdir -p "$ENBU_SIM_ARTIFACTS"
              go test -count=1 -p=1 -parallel=1 -timeout="$DST_TIMEOUT" -coverpkg=./app -coverprofile=.tmp/simulation/lane-2/coverage.out -run "$DST_TESTS" -v ./test/simulation
          - name: Explore and replay (lane 3)
            shell: bash
            env:
              ENBU_SIM_SHARD: '3'
              ENBU_SIM_ARTIFACTS: ${{ github.workspace }}/.tmp/simulation/lane-3
            run: |
              mkdir -p "$ENBU_SIM_ARTIFACTS"
              go test -count=1 -p=1 -parallel=1 -timeout="$DST_TIMEOUT" -coverpkg=./app -coverprofile=.tmp/simulation/lane-3/coverage.out -run "$DST_TESTS" -v ./test/simulation
      - name: Verify affected oracle mutation sensitivity
        if: needs.plan.outputs.mutation == 'true'
        env:
          ENBU_SIM_MUTATION: '1'
          ENBU_SIM_CASE_STRIDE: '1'
        run: go test -count=1 -timeout=10m ./test/simulation -run '^TestOracleMutationExperiments$'
      - name: Upload coverage and failure recordings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: simulation-${{ matrix.platform.target }}
          path: ${{ github.workspace }}/.tmp/simulation
          if-no-files-found: ignore
          retention-days: 14

  simulation-status:
    name: Simulation
    if: always()
    needs: [plan, simulation]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the plan and every selected platform to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHOULD_RUN: ${{ needs.plan.outputs.run }}
          RESULT: ${{ needs.simulation.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$SHOULD_RUN" = true ]; then
            test "$RESULT" = success
          else
            test "$RESULT" = skipped
          fi
