name: Actionlint

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # Branch pushes cover same-repository PRs once; forks need a PR event.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate workflows independently of CI
        # actionlint does not yet recognize native actions.lock local refs.
        # Keep the exception specific; CI separately verifies actions.lock.
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
          -ignore 'specifying action "\$/\.github/actions/[^" ]+" in invalid format because ref is missing' 
