name: Actionlint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
      - 'tools/workflowlint/**'
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Validate workflows independently of CI
        # Validate the native parallel container, then lint each contained step.
        # Upstream actionlint v1.7.12 does not parse the new group syntax yet.
        run: go run ./tools/workflowlint
