name: Release build

# Reusable workflow. Builds, signs and attests the release assets so that
# `gh attestation verify --signer-workflow` can pin the signer to this file.

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to build (e.g. v1.2.3)"
        required: true
        type: string
      dry-run:
        description: "Build and compare only: check out the triggering commit, tag it locally, and skip signing"
        required: false
        type: boolean
        default: false

permissions: {}

env:
  # The Xcode that builds the macOS app. A release can be rebuilt bit for bit
  # only with the same Xcode, so it changes only on purpose.
  XCODE_VERSION: "16.4"

jobs:
  # Every asset is reproducible: `task release/build` gives the same bytes from
  # the same tag on any machine of its platform (docs/reproducible-builds.md).
  # On Linux it builds the CLI, its packages, the Windows desktop app, the VS
  # Code extensions and the Linux desktop app; on macOS, the macOS desktop app.
  # The cross-built assets come out of both Linux runners; the amd64 one
  # publishes them, and the arm64 one publishes only its own desktop app.
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            suffix: linux_amd64
            publish: all
          - os: ubuntu-26.04-arm
            suffix: linux_arm64
            publish: desktop
          - os: macos-15
            suffix: darwin_arm64
            publish: all
          - os: macos-15-intel
            suffix: darwin_amd64
            publish: all
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.dry-run && github.sha || format('refs/tags/{0}', inputs.version) }}
          fetch-depth: 0
          persist-credentials: false

      # A dry run has no pushed tag; a local one on HEAD stands in for it.
      - name: Tag the dry run locally
        if: inputs.dry-run
        env:
          VERSION: ${{ inputs.version }}
        run: git tag "$VERSION"

      - parallel:
          - uses: $/.github/actions/setup-go
            with:
              cache: "true"

          - uses: $/.github/actions/setup-tools
            with:
              cache: "true"

          - uses: $/.github/actions/setup-frontend
            with:
              cache: "true"

          - uses: $/.github/actions/desktop-deps

      - name: Select the pinned Xcode
        if: runner.os == 'macOS'
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "Xcode $XCODE_VERSION is not on this runner; it has:"; ls -d /Applications/Xcode*
            exit 1
          fi
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build reproducible assets
        env:
          VERSION: ${{ inputs.version }}
        run: task release/build VERSION="$VERSION"

      - name: Select the assets this runner publishes
        env:
          PUBLISH: ${{ matrix.publish }}
        run: |
          set -euo pipefail
          mkdir -p publish
          : > published.sha256
          while read -r sum name; do
            file=${name%:contents}
            case "$PUBLISH:$file" in
              all:* | desktop:enbu-desktop_*_linux_*)
                cp "dist/$file" publish/
                printf '%s  %s\n' "$sum" "$name" >> published.sha256
                ;;
            esac
          done < dist/reproducible.sha256
          test -s published.sha256

      - name: Upload assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.suffix }}
          compression-level: 0
          path: publish/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload the list of assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: published-list-${{ matrix.suffix }}
          path: published.sha256
          if-no-files-found: error
          retention-days: 1

  # An independent rebuild of every platform: a fresh clone in another
  # directory, with no Go, tool or dependency cache. The arm64 Linux runner
  # rebuilds the cross-built assets the amd64 one published, so they are also
  # compared across CPU architectures. Nothing is signed or published unless
  # every asset matches what this runner rebuilt, and every asset its platform
  # publishes was rebuilt.
  reproduce:
    name: Rebuild and compare (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            suffix: linux_amd64
            publish: all
          - os: ubuntu-26.04-arm
            suffix: linux_arm64
            publish: desktop
          - os: macos-15
            suffix: darwin_arm64
            publish: all
          - os: macos-15-intel
            suffix: darwin_amd64
            publish: all
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.dry-run && github.sha || format('refs/tags/{0}', inputs.version) }}
          fetch-depth: 0
          persist-credentials: false

      # A dry run has no pushed tag; a local one on HEAD stands in for it.
      - name: Tag the dry run locally
        if: inputs.dry-run
        env:
          VERSION: ${{ inputs.version }}
        run: git tag "$VERSION"

      - parallel:
          - uses: $/.github/actions/setup-go
            with:
              cache: "false"

          - uses: $/.github/actions/setup-tools
            with:
              cache: "false"

          - uses: $/.github/actions/setup-frontend
            with:
              cache: "false"

          - uses: $/.github/actions/desktop-deps

      - name: Select the pinned Xcode
        if: runner.os == 'macOS'
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "Xcode $XCODE_VERSION is not on this runner; it has:"; ls -d /Applications/Xcode*
            exit 1
          fi
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"

      # A fresh clone in another directory, so nothing of the checkout above
      # (paths, file times) can make the two builds agree by accident.
      - name: Rebuild reproducible assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git clone --quiet --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rebuild/enbu"
          cd "$RUNNER_TEMP/rebuild/enbu"
          git checkout --quiet "refs/tags/$VERSION"
          task release/build VERSION="$VERSION"

      - name: Download the assets to publish
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: published
          merge-multiple: true

      - name: Download the list of this platform's assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: published-list-${{ matrix.suffix }}
          path: published-list

      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rebuild/enbu"
          task release/verify PUBLISHED="$GITHUB_WORKSPACE/published"
          missing=$(comm -23 \
            <(awk '{print $2}' "$GITHUB_WORKSPACE/published-list/published.sha256" | LC_ALL=C sort) \
            <(awk '{print $2}' dist/reproducible.sha256 | LC_ALL=C sort))
          if [ -n "$missing" ]; then
            echo "published but not rebuilt:"; echo "$missing"
            exit 1
          fi

  assets:
    name: Sign and attest assets
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - build
      - reproduce
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - parallel:
          - uses: sigstore/cosign-installer@v4.1.3

          - uses: anchore/sbom-action/download-syft@v0.24.3

          - name: Download release artifacts
            uses: actions/download-artifact@v8.0.2
            with:
              pattern: release-*
              path: release-assets
              merge-multiple: true

          - name: Download the lists of published assets
            uses: actions/download-artifact@v8.0.2
            with:
              pattern: published-list-*
              path: published-lists

      # Merging the release-* artifacts keeps one file of each name, so two
      # runners publishing the same name would replace each other silently.
      - name: Require each asset to come from one runner
        shell: bash
        run: |
          set -euo pipefail
          dup=$(cat published-lists/*/published.sha256 | awk '{print $2}' | LC_ALL=C sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "published by more than one runner:"; echo "$dup"
            exit 1
          fi

      - name: Generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            syft "$artifact" -o spdx-json > "${artifact}.sbom.spdx.json"
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f \
              ! -name '*.sigstore.json' \
              ! -name 'checksums.txt' \
              -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > checksums.txt
          )

      - name: Sign release assets
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign sign-blob \
              --bundle="${artifact}.sigstore.json" \
              "$artifact" \
              --yes
          done

      - name: Generate artifact attestations
        uses: actions/attest@v4.2.2
        with:
          # checksums.txt lists every asset except itself and the cosign bundles,
          # so the signature bundles are not attested as if they were assets.
          subject-checksums: release-assets/checksums.txt

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/checksums.txt
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.exe' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.dmg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.tar.gz' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-vscode_*.vsix' | wc -l)" -eq 6
          test "$(find release-assets -maxdepth 1 -type f -name '*.sbom.spdx.json' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name '*.sigstore.json' | wc -l)" -gt 0
          (cd release-assets && sha256sum -c checksums.txt)

      - name: Upload attested assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: attested-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
