name: Release build

# Reusable workflow. Builds, signs and attests the release assets so that
# `gh attestation verify --signer-workflow` can pin the signer to this file.

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to build (e.g. v1.2.3)"
        required: true
        type: string

permissions: {}

jobs:
  cli:
    name: Build CLI
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI artifacts
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-cli
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Build frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.65.2

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: false
          package-manager: false
          node-manager: false

      - name: Build frontend for Go embed
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Build desktop (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [frontend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            suffix: windows_amd64
            package: zip
          - os: windows-11-arm
            suffix: windows_arm64
            package: zip
          - os: macos-15
            suffix: darwin_arm64
            package: dmg
          - os: ubuntu-24.04
            suffix: linux_amd64
            package: tar.gz
          - os: ubuntu-24.04-arm
            suffix: linux_arm64
            package: tar.gz
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.65.2

      - name: Download frontend artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-dist
          path: web/dist

      - uses: $/.github/actions/desktop-deps

      # Each runner builds for its own platform and architecture.
      - name: Build desktop app
        shell: bash
        env:
          ENBU_FRONTEND_PREBUILT: "1"
        run: task gui/build

      - name: Package desktop app
        if: matrix.package == 'tar.gz'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          tar -C desktop/wails/build/bin \
            -czf "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.tar.gz" \
            .

      # The .deb and .rpm install the desktop entry and icon system-wide.
      - name: Package desktop app as .deb and .rpm
        if: matrix.package == 'tar.gz'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          task gui/package/linux
          for package in desktop/wails/build/package/*; do
            case "$package" in
              *.deb) ext=deb ;;
              *.rpm) ext=rpm ;;
              *) continue ;;
            esac
            cp "$package" "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.${ext}"
          done

      - name: Package desktop app
        if: matrix.package == 'dmg'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app_path="$(find desktop/wails/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p release
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install \
            --disable-pip-version-check \
            dmgbuild==1.6.7
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" \
            -s .github/dmg-settings.py \
            -D app="$app_path" \
            enbu \
            "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.dmg"

      - name: Package desktop app
        if: matrix.package == 'zip'
        shell: pwsh
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $binary = Get-ChildItem desktop/wails/build/bin -Filter *.exe | Select-Object -First 1
          if ($null -eq $binary) {
            throw "Wails did not produce a Windows executable"
          }
          $staging = Join-Path $env:RUNNER_TEMP "enbu-desktop"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item `
            -Path $binary.FullName `
            -Destination (Join-Path $staging "enbu-desktop.exe")
          Compress-Archive `
            -Path (Join-Path $staging "enbu-desktop.exe") `
            -DestinationPath "release/enbu-desktop_${env:VERSION}_${env:DESKTOP_SUFFIX}.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-enbu-desktop-${{ matrix.suffix }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  vscode:
    name: Build VS Code extension
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [cli]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua.yaml') }}
          restore-keys: |
            v2-aqua-installer-${{ runner.os }}-${{ runner.arch }}-

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.65.2

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: false
          package-manager: false
          node-manager: false

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-cli
          path: cli-archives

      - name: Build extension
        run: task vscode/build

      # One VSIX per VS Code target, each carrying the CLI binary built above
      # for that platform. The Marketplace and `code --install-extension` pick
      # the VSIX for the user's platform, so enbu installs with the extension.
      - name: Package extension
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for pair in \
            linux_amd64:linux-x64 \
            linux_arm64:linux-arm64 \
            darwin_arm64:darwin-arm64 \
            windows_amd64:win32-x64 \
            windows_arm64:win32-arm64; do
            suffix="${pair%%:*}"
            target="${pair##*:}"
            bin_dir="$RUNNER_TEMP/enbu-$suffix"
            mkdir -p "$bin_dir"
            case "$suffix" in
              windows_*)
                unzip -o -j "cli-archives/enbu_${VERSION}_${suffix}.zip" enbu.exe -d "$bin_dir"
                binary="$bin_dir/enbu.exe"
                ;;
              *)
                tar -xzf "cli-archives/enbu_${VERSION}_${suffix}.tar.gz" -C "$bin_dir" enbu
                binary="$bin_dir/enbu"
                ;;
            esac
            node vscode/scripts/package.mjs \
              --enbu "$binary" \
              --target "$target" \
              --version "$VERSION" \
              --out "release/enbu-vscode_${VERSION}_${suffix}.vsix"
          done

      - name: Upload VS Code extension artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-vscode
          path: release/*.vsix
          if-no-files-found: error
          retention-days: 1

  assets:
    name: Sign and attest assets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - cli
      - desktop
      - vscode
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action/download-syft@v0.24.3

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            syft "$artifact" -o spdx-json > "${artifact}.sbom.spdx.json"
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f \
              ! -name '*.sigstore.json' \
              ! -name 'checksums.txt' \
              -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > checksums.txt
          )

      - name: Sign release assets
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign sign-blob \
              --bundle="${artifact}.sigstore.json" \
              "$artifact" \
              --yes
          done

      - name: Generate artifact attestations
        uses: actions/attest@v4.2.2
        with:
          # checksums.txt lists every asset except itself and the cosign bundles,
          # so the signature bundles are not attested as if they were assets.
          subject-checksums: release-assets/checksums.txt

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/checksums.txt
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.exe' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.tar.gz' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-vscode_*.vsix' | wc -l)" -eq 5
          test "$(find release-assets -maxdepth 1 -type f -name '*.sbom.spdx.json' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name '*.sigstore.json' | wc -l)" -gt 0
          (cd release-assets && sha256sum -c checksums.txt)

      - name: Upload attested assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: attested-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
