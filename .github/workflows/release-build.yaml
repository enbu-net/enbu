name: Release build

# Reusable workflow. Builds, signs and attests the release assets so that
# `gh attestation verify --signer-workflow` can pin the signer to this file.

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to build (e.g. v1.2.3)"
        required: true
        type: string

permissions: {}

jobs:
  # The CLI archives and packages, the Windows desktop app and the VS Code
  # extensions are reproducible: `task release/build` gives the same bytes from
  # the same tag on any machine (docs/reproducible-builds.md). This job builds
  # the assets that are published; reproduce builds them again elsewhere.
  reproducible:
    name: Build reproducible assets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go

          - uses: $/.github/actions/setup-tools

          - uses: $/.github/actions/setup-frontend

          - uses: $/.github/actions/desktop-deps

      - name: Build reproducible assets
        env:
          VERSION: ${{ inputs.version }}
        run: task release/build VERSION="$VERSION"

      - name: Upload reproducible assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-reproducible
          compression-level: 0
          path: |
            dist/enbu_*.tar.gz
            dist/enbu_*.zip
            dist/enbu_*.deb
            dist/enbu_*.rpm
            dist/enbu_*.apk
            dist/enbu_*.pkg.tar.zst
            dist/enbu-desktop_*_windows_*.zip
            dist/enbu-vscode_*.vsix
          if-no-files-found: error
          retention-days: 1

  # An independent rebuild: another runner, another CPU architecture, another
  # checkout path, and no Go, tool or dependency cache. Nothing is signed or
  # published unless every asset it builds matches the uploaded one bit for bit.
  reproduce:
    name: Rebuild and compare
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    needs: [reproducible]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - parallel:
          - uses: $/.github/actions/setup-go
            with:
              cache: "false"

          - uses: $/.github/actions/setup-tools
            with:
              cache: "false"

          - uses: $/.github/actions/setup-frontend
            with:
              cache: "false"

          - uses: $/.github/actions/desktop-deps

      # A fresh clone in another directory, so nothing of the checkout above
      # (paths, file times) can make the two builds agree by accident.
      - name: Rebuild reproducible assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git clone --quiet --no-local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/rebuild/enbu"
          cd "$RUNNER_TEMP/rebuild/enbu"
          git checkout --quiet "refs/tags/$VERSION"
          task release/build VERSION="$VERSION"
          cp dist/reproducible.sha256 "$GITHUB_WORKSPACE/rebuilt.sha256"

      - name: Download the assets to publish
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-reproducible
          path: published

      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          test "$(find published -type f | wc -l)" -eq "$(wc -l < rebuilt.sha256)"
          (cd published && sha256sum --strict -c ../rebuilt.sha256)

  frontend:
    name: Build frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: $/.github/actions/setup-tools

      - uses: $/.github/actions/setup-frontend

      - name: Build frontend for Go embed
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist
          compression-level: 1
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Build desktop (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [frontend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            suffix: darwin_arm64
            package: dmg
          - os: macos-15-intel
            suffix: darwin_amd64
            package: dmg
          - os: ubuntu-26.04
            suffix: linux_amd64
            package: tar.gz
          - os: ubuntu-26.04-arm
            suffix: linux_arm64
            package: tar.gz
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup-go

      - uses: $/.github/actions/setup-tools

      - name: Download frontend artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-dist
          path: web/dist

      - uses: $/.github/actions/desktop-deps

      # Each runner builds for its own platform and architecture.
      - name: Build desktop app
        shell: bash
        env:
          ENBU_FRONTEND_PREBUILT: "1"
        run: task gui/build

      - name: Package desktop app
        if: matrix.package == 'tar.gz'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          tar -C desktop/wails/build/bin \
            -czf "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.tar.gz" \
            .

      # The .deb and .rpm install the desktop entry and icon system-wide.
      - name: Package desktop app as .deb and .rpm
        if: matrix.package == 'tar.gz'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          task gui/package/linux
          for package in desktop/wails/build/package/*; do
            case "$package" in
              *.deb) ext=deb ;;
              *.rpm) ext=rpm ;;
              *) continue ;;
            esac
            cp "$package" "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.${ext}"
          done

      - name: Package desktop app
        if: matrix.package == 'dmg'
        shell: bash
        env:
          DESKTOP_SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app_path="$(find desktop/wails/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p release
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install \
            --disable-pip-version-check \
            dmgbuild==1.6.7
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" \
            -s .github/dmg-settings.py \
            -D app="$app_path" \
            enbu \
            "release/enbu-desktop_${VERSION}_${DESKTOP_SUFFIX}.dmg"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-enbu-desktop-${{ matrix.suffix }}
          compression-level: 0
          path: release/*
          if-no-files-found: error
          retention-days: 1

  assets:
    name: Sign and attest assets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
      - reproducible
      - reproduce
      - desktop
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - parallel:
          - uses: sigstore/cosign-installer@v4.1.3

          - uses: anchore/sbom-action/download-syft@v0.24.3

          - name: Download release artifacts
            uses: actions/download-artifact@v8.0.2
            with:
              pattern: release-*
              path: release-assets
              merge-multiple: true

      - name: Generate SBOMs
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            syft "$artifact" -o spdx-json > "${artifact}.sbom.spdx.json"
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f \
              ! -name '*.sigstore.json' \
              ! -name 'checksums.txt' \
              -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > checksums.txt
          )

      - name: Sign release assets
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            [ -f "$artifact" ] || continue
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign sign-blob \
              --bundle="${artifact}.sigstore.json" \
              "$artifact" \
              --yes
          done

      - name: Generate artifact attestations
        uses: actions/attest@v4.2.2
        with:
          # checksums.txt lists every asset except itself and the cosign bundles,
          # so the signature bundles are not attested as if they were assets.
          subject-checksums: release-assets/checksums.txt

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/checksums.txt
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.exe' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_windows_*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.dmg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-desktop_*_darwin_*.tar.gz' | wc -l)" -eq 0
          test "$(find release-assets -maxdepth 1 -type f -name 'enbu-vscode_*.vsix' | wc -l)" -eq 6
          test "$(find release-assets -maxdepth 1 -type f -name '*.sbom.spdx.json' | wc -l)" -gt 0
          test "$(find release-assets -maxdepth 1 -type f -name '*.sigstore.json' | wc -l)" -gt 0
          (cd release-assets && sha256sum -c checksums.txt)

      - name: Upload attested assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: attested-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
